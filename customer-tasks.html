<style>
:root{--navy:#101b30;--blue:#295fe8;--text:#17243a;--muted:#748197;--line:#e4e9f1;--bg:#f4f6fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif}button,input,select,textarea{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:inherit;text-decoration:none}[hidden]{display:none!important}:focus-visible{outline:3px solid #82a5ff;outline-offset:3px}.bar{background:#fff;border-bottom:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top)) 20px 16px}.bar-inner{max-width:950px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand img{width:36px;height:36px;border-radius:9px}.home-link{font-size:12px;color:var(--muted)}.wrap{max-width:950px;margin:auto;padding:24px 20px calc(32px + env(safe-area-inset-bottom))}.pages{display:flex;gap:8px;margin-bottom:24px}.pages a{padding:9px 14px;border:1px solid var(--line);border-radius:30px;font-size:12px;background:#fff}.pages .on{background:var(--navy);color:#fff;border-color:var(--navy)}.heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--blue);font-weight:700}h1{font-size:28px;letter-spacing:-1px;margin:7px 0}p{font-size:13px;line-height:1.6;color:var(--muted);margin:0}.primary{background:var(--blue);color:white;border:0;border-radius:11px;padding:12px 17px;font-size:13px;font-weight:700;white-space:nowrap}.primary:disabled{opacity:.5}.summary{background:var(--navy);color:#fff;border-radius:18px;padding:23px;display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:20px}.summary div+div{border-left:1px solid #ffffff20;padding-left:22px}.summary span{font-size:11px;color:#a9b7cf}.summary b{display:block;font-size:29px;margin-top:6px}.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.filters button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:9px;padding:9px 13px;font-size:12px}.filters button.on{background:#e9efff;border-color:#bacbff;color:var(--blue);font-weight:750}.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:13px 15px;margin-bottom:16px;font-size:13px}.list{display:grid;gap:12px}.task{border:1px solid var(--line);border-radius:15px;background:#fff;padding:18px;display:grid;grid-template-columns:28px 1fr;gap:12px}.check{width:25px;height:25px;border-radius:50%;border:1.5px solid #ccd6e5;background:#fff;color:white;font-size:15px;padding:0;align-self:start}.done .check{background:#295fe8;border-color:#295fe8}.task h2{font-size:16px;margin:0 0 8px;overflow-wrap:anywhere}.done h2{text-decoration:line-through;color:#8c98aa}.metadata{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px;font-size:11px;color:var(--muted)}.tag{padding:4px 7px;border-radius:6px;background:#f1f4f9;color:#5d6e87}.tag.overdue{background:#fff0ef;color:#d04e45}.tag.today{background:#eaf0ff;color:var(--blue)}.customer{font-size:13px;margin-bottom:7px;color:#44536b;overflow-wrap:anywhere}.note{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.7;color:var(--muted)}.actions{display:flex;align-items:center;gap:12px;margin-top:13px}.actions button,.actions a{padding:0;border:0;background:none;font-size:11px;color:#697a94}.actions .call{color:var(--blue);font-weight:700}.empty{background:#fff;border:1px dashed #d5deec;border-radius:16px;padding:42px 20px;text-align:center}.empty b{display:block;margin-bottom:8px;font-size:16px}.foot{margin-top:22px;font-size:11px;text-align:center;color:#929dad}.status{font-size:12px;color:#cf4f48;margin:12px 0;min-height:16px}dialog{width:min(500px,calc(100% - 28px));max-height:90vh;max-height:90dvh;border:0;border-radius:19px;padding:24px;color:var(--text);background:#fff;overflow:auto;box-shadow:0 20px 80px #101b3040}dialog::backdrop{background:#101b307a}dialog h2{font-size:21px;margin:0 0 21px}.field{display:block;margin:14px 0;font-size:12px;font-weight:650}.field input,.field select,.field textarea{display:block;width:100%;margin-top:7px;border:1px solid #dce3ee;border-radius:9px;padding:11px;background:#fafbfd;color:var(--text);font-size:14px}.field textarea{min-height:86px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.secondary{padding:11px 16px;background:white;color:var(--muted);border:1px solid var(--line);border-radius:10px}.confirm-text{font-size:14px;line-height:1.7;color:var(--text)}@media(max-width:600px){.wrap{padding:20px 17px calc(28px + env(safe-area-inset-bottom))}h1{font-size:25px}.heading p{font-size:12px}.primary{padding:11px 13px;font-size:12px}.summary{padding:19px}.summary div+div{padding-left:14px}.summary b{font-size:26px}.task{padding:16px 13px;gap:10px}.filters button{padding:8px 10px}.row{gap:9px}dialog{padding:21px}.pages{margin-bottom:21px}}@media(prefers-reduced-motion:no-preference){.wrap{animation:enter .22s ease-out}@keyframes enter{from{opacity:.5;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}}
</style></head><body>
<header class="bar"><div class="bar-inner"><a class="brand" href="index.html"><img src="assets/dealer-mate-logo.webp" alt="">딜러메이트</a><a class="home-link" href="index.html">← 메인 화면</a></div></header>
<main class="wrap" id="workspace" hidden><nav class="pages" aria-label="업무 화면"><a href="index.html">딜러 워크스페이스</a><a href="customer-tasks.html" class="on" aria-current="page">고객관리 &amp; 할 일</a></nav><div class="heading"><div><div class="eyebrow">CUSTOMERS & TO DO</div><h1>고객관리 &amp; 할 일</h1><p>연락할 고객과 챙겨야 할 업무를 한눈에.</p></div><button class="primary" id="addTask">＋ 할 일 추가</button></div><section class="summary" aria-label="할 일 요약"><div><span>오늘 할 일</span><b id="todayCount">0</b></div><div><span>미완료</span><b id="pendingCount">0</b></div><div><span>완료</span><b id="doneCount">0</b></div></section><nav class="filters" aria-label="할 일 필터"><button data-filter="pending" class="on" aria-pressed="true">미완료</button><button data-filter="today" aria-pressed="false">오늘</button><button data-filter="overdue" aria-pressed="false">기한 지남</button><button data-filter="all" aria-pressed="false">전체</button><button data-filter="done" aria-pressed="false">완료</button></nav><input id="search" class="search" type="search" placeholder="고객명, 차량, 할 일 검색" aria-label="고객명, 차량, 할 일 검색"><p id="syncStatus" class="foot" role="status" aria-live="polite">저장 연결을 확인하고 있어요…</p><div id="status" class="status" role="status" aria-live="polite"></div><section id="taskList" class="list" aria-label="할 일 목록"></section><p class="foot">오른쪽으로 넘기면 메인 화면으로 돌아갑니다.<br>같은 계정으로 로그인한 PC와 앱의 기록을 함께 사용합니다.</p></main><p id="loading" class="wrap" role="status">로그인 상태를 확인하고 있어요…</p>
<dialog id="taskEditor" aria-labelledby="editorTitle"><form id="taskForm"><h2 id="editorTitle">할 일 추가</h2><label class="field">할 일 *<input id="taskTitle" required maxlength="120" placeholder="예: 견적 보내기, 계약 확인"></label><div class="row"><label class="field">고객명<input id="customerName" maxlength="60" autocomplete="off" placeholder="고객 이름"></label><label class="field">연락처<input id="customerPhone" type="tel" maxlength="30" autocomplete="off" placeholder="010-0000-0000"></label></div><label class="field">차량<input id="customerCar" maxlength="120" placeholder="차량명 또는 차량번호"></label><div class="row"><label class="field">날짜<input id="taskDate" type="date"></label><label class="field">업무 종류<select id="taskCategory"><option>고객 연락</option><option>견적·상담</option><option>계약·출고</option><option>차량 업무</option><option>기타</option></select></label></div><label class="field">메모<textarea id="taskNote" maxlength="2000" placeholder="상담 내용이나 다음에 확인할 내용을 적어주세요."></textarea></label><p id="editorStatus" class="status" role="status"></p><div class="dialog-actions"><button type="button" class="secondary" id="cancelEdit">취소</button><button type="submit" class="primary">저장하기</button></div></form></dialog>
<dialog id="deleteDialog" aria-labelledby="deleteTitle"><h2 id="deleteTitle">할 일을 삭제할까요?</h2><p class="confirm-text" id="deleteDescription"></p><div class="dialog-actions"><button class="secondary" id="cancelDelete">취소</button><button class="primary" id="confirmDelete">삭제하기</button></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
'use strict';
let tasks=[],storageKey='',filter='pending',editingId=null,deletingId=null;
let syncClient=null,outbox={},syncBusy=false,syncAgain=false,syncTimer=null;
const $=id=>document.getElementById(id);
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function selectTasks(items,mode,query,today){return items.filter(t=>{if(mode==='pending'&&t.done)return false;if(mode==='done'&&!t.done)return false;if(mode==='today'&&(t.done||t.date!==today))return false;if(mode==='overdue'&&(t.done||!t.date||t.date>=today))return false;return !query||[t.title,t.customer,t.phone,t.car,t.note].join(' ').toLocaleLowerCase().includes(query.toLocaleLowerCase())}).sort((a,b)=>Number(a.done)-Number(b.done)||(a.date||'9999').localeCompare(b.date||'9999')||b.createdAt-a.createdAt)}

function persist(next){
 const previous=tasks,previousOutbox={...outbox};
 const before=new Map(tasks.map(t=>[t.id,t]));
 for(const t of next){const old=before.get(t.id);if(!old||JSON.stringify(old)!==JSON.stringify(t))outbox[t.id]={...t,updatedAt:t.updatedAt||Date.now()};before.delete(t.id)}
 for(const id of before.keys())outbox[id]={id,deleted:true,updatedAt:Date.now()};
 try{
  localStorage.setItem(storageKey+'_outbox',JSON.stringify(outbox));
  localStorage.setItem(storageKey,JSON.stringify(next));tasks=next;$('status').textContent='';
  $('syncStatus').textContent='이 기기에 저장됨 · 동기화 중…';
  scheduleSync();return true;
 }catch(e){outbox=previousOutbox;tasks=previous;$('status').textContent='저장하지 못했습니다. 기기의 저장 공간과 브라우저 설정을 확인해주세요.';return false}
}
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(syncTasks,250)}
async function syncTasks(){
 if(!syncClient||!storageKey)return;
 if(syncBusy){syncAgain=true;return}
 syncBusy=true;
 const sent={...outbox};
 try{
  const payload=Object.values(sent).map(record=>({id:record.id,record,updated_at:new Date(record.updatedAt).toISOString()}));
  const {data,error}=await syncClient.rpc('dealer_mate_sync_tasks',{payload});
  if(error)throw error;
  for(const [id,record] of Object.entries(sent))if(outbox[id]?.updatedAt===record.updatedAt)delete outbox[id];
  const merged=new Map((data||[]).map(row=>[row.id,{...row.record,id:row.id}]));
  for(const record of Object.values(outbox))merged.set(record.id,record);
  tasks=[...merged.values()].filter(t=>!t.deleted);
  localStorage.setItem(storageKey+'_outbox',JSON.stringify(outbox));
  localStorage.setItem(storageKey,JSON.stringify(tasks));
  localStorage.setItem(storageKey+'_synced','1');
  $('syncStatus').textContent=Object.keys(outbox).length?'저장 동기화 중…':'PC·앱 저장 연결됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  render();
 }catch(e){
  const missing=['PGRST202','42P01','42883'].includes(e.code)||/dealer_mate_sync_tasks.*(not find|does not exist)/i.test(e.message||'');
  $('syncStatus').textContent=missing?'저장 서비스 설정 필요 · 기록은 이 기기에 보관 중':'연결 대기 중 · 이 기기의 변경 사항은 연결되면 동기화됩니다.';
  console.warn('고객관리 &amp; 할 일 동기화 실패',e);
 }finally{
  syncBusy=false;
  if(syncAgain){syncAgain=false;scheduleSync()}
 }
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncTasks()});
window.addEventListener('online',syncTasks);

function render(){const today=todayISO();$('todayCount').textContent=tasks.filter(t=>!t.done&&t.date===today).length;$('pendingCount').textContent=tasks.filter(t=>!t.done).length;$('doneCount').textContent=tasks.filter(t=>t.done).length;const visible=selectTasks(tasks,filter,$('search').value.trim(),today);$('taskList').innerHTML=visible.length?visible.map(t=>{const phone=String(t.phone||'').replace(/[^0-9+]/g,'');const overdue=!t.done&&t.date&&t.date<today;const dueToday=!t.done&&t.date===today;return `<article class="task ${t.done?'done':''}"><button class="check" data-action="toggle" data-id="${escapeHtml(t.id)}" aria-label="${t.done?'미완료로 변경':'완료로 변경'}: ${escapeHtml(t.title)}" aria-pressed="${!!t.done}">${t.done?'✓':''}</button><div><h2>${escapeHtml(t.title)}</h2><div class="metadata"><span class="tag">${escapeHtml(t.category)}</span><span class="tag ${overdue?'overdue':dueToday?'today':''}">${t.date?escapeHtml(t.date)+(overdue?' · 기한 지남':dueToday?' · 오늘':''):'날짜 미지정'}</span>${t.done?'<span>완료</span>':''}</div>${t.customer||t.car?`<div class="customer">${[t.customer,t.car].filter(Boolean).map(escapeHtml).join(' · ')}</div>`:''}${t.phone?`<p>${escapeHtml(t.phone)}</p>`:''}${t.note?`<div class="note">${escapeHtml(t.note)}</div>`:''}<div class="actions">${phone?(window.AndroidExternal?`<button class="call" data-action="phone" data-id="${escapeHtml(t.id)}">번호 복사</button>`:`<a class="call" href="tel:${phone}">전화하기</a>`):''}<button data-action="edit" data-id="${escapeHtml(t.id)}">수정</button><button data-action="delete" data-id="${escapeHtml(t.id)}">삭제</button></div></div></article>`}).join(''):'<div class="empty"><b>표시할 할 일이 없어요</b><p>할 일을 추가하거나 다른 필터로 확인해보세요.</p></div>';publishTaskWidget();}

function publishTaskWidget(){
 if(!storageKey)return;
 try{if(window.AndroidTaskWidget && typeof AndroidTaskWidget.setTasks==='function')AndroidTaskWidget.setTasks(JSON.stringify(tasks))}catch(e){console.warn('위젯 갱신 실패',e)}
}
function consumeWidgetTaskAction(){
 const url=new URL(window.location.href),complete=url.searchParams.get('widgetTaskComplete'),id=url.searchParams.get('widgetTaskId');
 if(!complete&&!id)return;
 url.searchParams.delete('widgetTaskComplete');url.searchParams.delete('widgetTaskId');
 window.history.replaceState(null,'',url.toString());
 const task=tasks.find(t=>t.id===(complete||id));
 if(!task){$('status').textContent='해당 할 일이 삭제되었거나 다른 계정의 기록입니다.';return}
 if(complete){
  if(!task.done && persist(tasks.map(t=>t.id===task.id?{...t,done:true,updatedAt:Date.now()}:t)))render();
 }else openEditor(task.id);
}

function openEditor(id=null){editingId=id;const t=tasks.find(x=>x.id===id);$('taskForm').reset();$('editorTitle').textContent=t?'할 일 수정':'할 일 추가';for(const [field,key] of [['taskTitle','title'],['customerName','customer'],['customerPhone','phone'],['customerCar','car'],['taskDate','date'],['taskNote','note']])$(field).value=t?.[key]||'';$('taskCategory').value=t?.category||'고객 연락';$('editorStatus').textContent='';$('taskEditor').showModal();$('taskTitle').focus()}
$('addTask').onclick=()=>openEditor();$('cancelEdit').onclick=()=>$('taskEditor').close();$('cancelDelete').onclick=()=>$('deleteDialog').close();
$('taskForm').onsubmit=e=>{e.preventDefault();const title=$('taskTitle').value.trim();if(!title){$('editorStatus').textContent='할 일을 입력해주세요.';return}const previous=tasks.find(t=>t.id===editingId);const task={id:previous?.id||crypto.randomUUID(),title,customer:$('customerName').value.trim(),phone:$('customerPhone').value.trim(),car:$('customerCar').value.trim(),date:$('taskDate').value,category:$('taskCategory').value,note:$('taskNote').value.trim(),done:previous?.done||false,createdAt:previous?.createdAt||Date.now(),updatedAt:Date.now()};const next=previous?tasks.map(t=>t.id===task.id?task:t):[...tasks,task];if(persist(next)){$('taskEditor').close();render()}else $('editorStatus').textContent=$('status').textContent};
$('taskList').onclick=e=>{const b=e.target.closest('button[data-action]');if(!b)return;const t=tasks.find(x=>x.id===b.dataset.id);if(!t)return;if(b.dataset.action==='phone'){navigator.clipboard.writeText(t.phone).then(()=>{$('status').textContent='연락처를 복사했습니다.'}).catch(()=>{$('status').textContent='연락처: '+t.phone});return}if(b.dataset.action==='toggle'){if(persist(tasks.map(x=>x.id===t.id?{...x,done:!x.done,updatedAt:Date.now()}:x)))render()}else if(b.dataset.action==='edit')openEditor(t.id);else{deletingId=t.id;$('deleteDescription').textContent=t.title;$('deleteDialog').showModal()}};
$('confirmDelete').onclick=()=>{if(persist(tasks.filter(t=>t.id!==deletingId))){$('deleteDialog').close();render()}};
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',String(on))});render()});$('search').oninput=render;
let swipe=null;document.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('input,textarea,select,button,a,dialog')||document.querySelector('dialog[open]')){swipe=null;return}const t=e.touches[0];swipe={x:t.clientX,y:t.clientY,time:Date.now()}},{passive:true});document.addEventListener('touchend',e=>{if(!swipe)return;const t=e.changedTouches[0],dx=t.clientX-swipe.x,dy=t.clientY-swipe.y;if(dx>85&&Math.abs(dx)>Math.abs(dy)*1.7&&Date.now()-swipe.time<800)window.location.href='index.html';swipe=null},{passive:true});document.addEventListener('touchcancel',()=>swipe=null,{passive:true});
window.addEventListener('storage',e=>{if(e.key===storageKey||e.key===storageKey+'_outbox'){try{tasks=JSON.parse(localStorage.getItem(storageKey)||'[]');outbox=JSON.parse(localStorage.getItem(storageKey+'_outbox')||'{}');render();scheduleSync()}catch{}}});
(async()=>{try{if(!window.supabase)throw Error('로그인 서비스를 불러오지 못했습니다.');const client=window.supabase.createClient('https://crmeeegayzezeqhgkagx.supabase.co','sb_publishable_6wpAz2ELkD2Eh2ircwzVGw_78QKns9C');const {data,error}=await client.auth.getSession();if(error)throw error;if(!data.session){window.location.replace('index.html');return}storageKey='dealerMateTasks_v1_'+data.session.user.id;const raw=localStorage.getItem(storageKey);if(raw){const parsed=JSON.parse(raw);if(!Array.isArray(parsed))throw Error('저장된 기록을 읽지 못했습니다.');tasks=parsed}syncClient=client;outbox=JSON.parse(localStorage.getItem(storageKey+'_outbox')||'{}');if(!localStorage.getItem(storageKey+'_synced')){for(const t of tasks)if(!outbox[t.id])outbox[t.id]={...t,updatedAt:t.updatedAt||t.createdAt||Date.now()};localStorage.setItem(storageKey+'_outbox',JSON.stringify(outbox))}client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||(session&&session.user.id!==data.session.user.id)){try{window.AndroidTaskWidget?.clear()}catch(e){}window.location.replace('index.html')}});$('loading').hidden=true;$('workspace').hidden=false;render();await syncTasks();consumeWidgetTaskAction();setInterval(()=>{if(!document.hidden)syncTasks()},15000)}catch(e){$('loading').textContent='화면을 불러오지 못했습니다. '+(e.message||'메인으로 돌아가 다시 시도해주세요.')}})();
</script></body></html>
