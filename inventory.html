<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>매입관리</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--text:#172033;--muted:#7b8494;--line:#e3e8ef;--blue:#3867d6;--green:#1f9d68;--red:#e75b5b;--amber:#e49b31}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.app{max-width:1050px;margin:auto;padding:14px 14px 90px}
header{display:flex;align-items:center;gap:11px;margin-bottom:12px}.home{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:12px;display:grid;place-items:center;text-decoration:none;color:var(--text);font-size:18px}h1{font-size:22px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:2px}
.tabs{display:flex;background:#e9edf3;padding:4px;border-radius:13px;margin-bottom:12px}.tab{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;font-weight:900;color:#687386}.tab.active{background:#fff;color:var(--blue);box-shadow:0 2px 9px #24344a18}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.kpi span{display:block;color:var(--muted);font-size:10px;font-weight:800}.kpi b{display:block;margin-top:5px;font-size:16px}.kpi.profit b{color:var(--green)}
.toolbar{display:flex;gap:7px;margin-bottom:10px}.search{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-size:13px;outline:none}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}
.filters{display:flex;gap:6px;overflow:auto;padding-bottom:8px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800;color:#657083}.chip.active{background:#172033;color:#fff;border-color:#172033}
.list{display:grid;gap:8px}.empty{background:#fff;border:1px dashed #cdd5df;border-radius:16px;padding:45px 15px;text-align:center;color:var(--muted);font-size:13px}
.car{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;display:grid;grid-template-columns:1fr auto;gap:8px;cursor:pointer}.carTop{display:flex;gap:7px;align-items:center}.badge{font-size:9px;font-weight:900;border-radius:999px;padding:4px 7px;background:#eef2f7;color:#687386}.badge.sale{background:#eaf8f2;color:#18845a}.badge.done{background:#f1f2f4;color:#717985}.badge.auction{background:#fff4e4;color:#b77415}.carName{font-size:15px;font-weight:900;margin-top:7px}.carNo{font-size:11px;color:var(--muted);margin-top:3px}.money{text-align:right}.money b{font-size:15px}.money small{display:block;margin-top:4px;color:var(--green);font-weight:900}.meta{grid-column:1/3;border-top:1px solid #edf0f4;padding-top:8px;display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:#0008;z-index:50;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{width:min(760px,100%);max-height:94dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}.sheetHead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-14px;background:var(--bg);z-index:3;padding:14px 0 9px}.sheetHead h2{font-size:19px;margin:0}.close{border:0;background:#e6eaf0;width:34px;height:34px;border-radius:10px;font-size:20px}
.section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px}.section h3{font-size:13px;margin:0 0 11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{min-width:0}.field.full{grid-column:1/3}.field label{display:block;font-size:9px;font-weight:900;color:var(--muted);margin:0 0 4px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbfd;color:var(--text);font-size:13px}.field textarea{min-height:65px;resize:vertical}.labelAdd{display:flex;align-items:center;justify-content:space-between;gap:8px}.miniAdd{width:25px;height:25px;padding:0;border:0;border-radius:8px;background:#eef3ff;color:#315fc7;font-size:18px;font-weight:800;line-height:25px;cursor:pointer}.repairRow,.costRow{display:grid;grid-template-columns:1fr 125px 34px;gap:5px;margin-bottom:5px}.repairRow input,.costRow input{min-width:0}.repairDel,.costDel{border:0;border-radius:9px;background:#fff0f0;color:#c94545;font-weight:900}.transferBtn{width:100%;margin-top:8px;background:#fff7e8;color:#a56500;border:1px solid #f1d39b}
.result{display:grid;grid-template-columns:1fr 1fr;gap:7px}.result div{background:#f6f8fb;border-radius:11px;padding:10px}.result span{display:block;font-size:9px;color:var(--muted);font-weight:800}.result b{display:block;font-size:14px;margin-top:4px}.result .main{background:#eaf8f2}.result .main b{color:var(--green);font-size:17px}
.actions{display:flex;gap:7px;position:sticky;bottom:-14px;background:linear-gradient(transparent,var(--bg) 25%);padding:18px 0 4px}.actions .btn{flex:1}.danger{background:#fff0f0;color:#c94545;border:1px solid #ffd6d6}
@media(max-width:520px){.app{padding:10px 10px 78px}header{margin-bottom:8px}h1{font-size:19px}.home{width:34px;height:34px}.tabs{margin-bottom:8px}.tab{padding:8px}.summary{gap:5px;margin-bottom:8px}.kpi{padding:9px 8px;border-radius:11px}.kpi b{font-size:13px}.toolbar{margin-bottom:6px}.btn{padding:9px 11px}.car{padding:11px}.carName{font-size:14px}.grid{gap:7px}}
</style></head><body><main class="app">
<header><a class="home" href="index.html">‹</a><div><h1>매입관리</h1><div class="sub">차량 매입부터 판매까지 한눈에 관리</div></div></header>
<div class="tabs"><button class="tab active" data-type="소매" onclick="setType('소매')">소매</button><button class="tab" data-type="경매" onclick="setType('경매')">경매</button></div>
<section class="summary"><div class="kpi"><span>판매중</span><b id="kCount">0대</b></div><div class="kpi"><span>매입금액</span><b id="kBuy">0</b></div><div class="kpi"><span>판매예정</span><b id="kSell">0</b></div><div class="kpi profit"><span>예상수익</span><b id="kProfit">0</b></div></section>
<div class="toolbar"><input id="search" class="search" placeholder="차량번호 · 차량명 검색" oninput="render()"><button class="btn primary" onclick="openForm()">＋ 등록</button></div>
<div class="filters"><button class="chip active" data-filter="전체" onclick="setFilter('전체')">전체</button><button class="chip" data-filter="판매중" onclick="setFilter('판매중')">판매중</button><button class="chip" data-filter="완료" onclick="setFilter('완료')">완료</button></div>
<section id="list" class="list"></section>
</main>
<div id="overlay" class="overlay"><div class="sheet">
<div class="sheetHead"><h2 id="formTitle">차량 등록</h2><button class="close" onclick="closeForm()">취소</button></div>
<div class="section"><h3>기본정보</h3><div class="grid">
<div class="field"><label>구분</label><select id="type"><option>소매</option><option>경매</option><option>경매(오토마트)</option></select></div>
<div class="field"><label>상태</label><select id="status"><option>판매중</option><option>완료</option></select></div>
<div class="field"><label>차량번호</label><input id="carNo"></div><div class="field"><label>국산 / 수입</label><select id="origin" onchange="applyAutoCosts()"><option>국산</option><option>수입</option></select></div>
<div class="field full"><label>차량</label><input id="carName" placeholder="예: 520D M 스포츠"></div>
<div class="field"><label>매입일</label><input id="buyDate" type="date"></div><div class="field"><label>판매일</label><input id="sellDate" type="date"></div>
<div class="field"><label>매입금액</label><input id="buyPrice" inputmode="numeric" oninput="liveMoneyFormat(this);calc()"></div><div class="field"><label>매입원가</label><input id="purchaseCost" readonly></div>
<input id="sellPrice" type="hidden"><div class="field"><label>판매가</label><input id="sellPriceBottom" inputmode="numeric" oninput="liveMoneyFormat(this);syncSellPrice(this.value)"></div><div class="field"><label>예상수익</label><input id="expectedProfit" readonly></div>
<div class="field full"><label>특이사항</label><textarea id="note"></textarea></div></div></div>
<div class="section"><h3>상품화 비용</h3><div class="grid">
<div class="field"><label>성능비</label><select id="inspectionMode" onchange="toggleCostInput('inspection')"><option value="auto">35,000원</option><option value="manual">직접입력</option></select><input id="inspection" inputmode="numeric" oninput="liveMoneyFormat(this);calc()" style="display:none;margin-top:5px"></div>
<div class="field"><label>성능보험비</label><input id="insurance" inputmode="numeric" oninput="liveMoneyFormat(this);calc()"></div>
<div class="field"><label>도색 판수</label><select id="paintPanels" onchange="applyAutoCosts()"><option value="0">없음</option><option value="1">1판</option><option value="2">2판</option><option value="3">3판</option><option value="4">4판</option><option value="5">5판</option><option value="6">6판</option><option value="7">7판</option><option value="8">8판</option><option value="9">9판</option><option value="10">10판</option><option value="11">11판</option><option value="12">12판</option><option value="13">13판</option><option value="14">14판</option><option value="15">15판</option></select></div>
<div class="field"><label>도색비</label><select id="paintMode" onchange="toggleCostInput('paint')"><option value="auto">0원</option><option value="manual">직접입력</option></select><input id="paint" inputmode="numeric" oninput="liveMoneyFormat(this);calc()" style="display:none;margin-top:5px"></div>
<div class="field"><label>광택비</label><select id="polishMode" onchange="toggleCostInput('polish')"><option value="auto">143,000원</option><option value="manual">직접입력</option></select><input id="polish" inputmode="numeric" oninput="liveMoneyFormat(this);calc()" style="display:none;margin-top:5px"></div>
<div class="field"><label>휠복원</label><input id="wheel" inputmode="numeric" oninput="liveMoneyFormat(this);calc()"></div>
<div class="field"><label>매입취득세</label><input id="acqTax" inputmode="numeric" oninput="liveMoneyFormat(this);calc()"></div>
<div class="field full"><label class="labelAdd"><span>상품화추가(수리비용)</span><button type="button" class="miniAdd" onclick="addRepairRow()" aria-label="수리비용 추가">＋</button></label><div id="repairRows"></div><input id="prepExtra" type="hidden"></div>
</div></div>
<div class="section"><h3>기타 비용</h3><div class="grid">
<div class="field"><label>엔카광고</label><select id="encarMode" onchange="toggleOtherCost('encar')"><option value="auto">241,950원</option><option value="manual">직접입력</option></select><input id="encar" inputmode="numeric" oninput="liveMoneyFormat(this);calc()" style="display:none;margin-top:5px"></div>
<div class="field"><label>헤딜수수료</label><input id="heyd" inputmode="numeric" oninput="liveMoneyFormat(this);calc()"></div>
<div class="field full"><label class="labelAdd"><span>소개수수료</span><button type="button" class="miniAdd" onclick="addCostRow('intro')" aria-label="소개수수료 추가">＋</button></label><div id="introRows"></div><input id="intro" type="hidden"></div>

<div class="field full"><label class="labelAdd"><span>탁송료</span><button type="button" class="miniAdd" onclick="addCostRow('transport')" aria-label="탁송료 추가">＋</button></label><div id="transportRows"></div><input id="transport" type="hidden"></div>
<div class="field full"><label class="labelAdd"><span>업무대행</span><button type="button" class="miniAdd" onclick="addCostRow('agency')" aria-label="업무대행 추가">＋</button></label><div id="agencyRows"></div><input id="agency" type="hidden"></div>
<div class="field"><label>경매 횟수</label><select id="auctionCount" onchange="calc()"><option value="1">1회차</option><option value="2">2회차</option><option value="3">3회차</option><option value="4">4회차</option><option value="5">5회차</option><option value="6">6회차</option><option value="7">7회차</option><option value="8">8회차</option><option value="9">9회차</option><option value="10">10회차</option><option value="11">11회차</option><option value="12">12회차</option><option value="13">13회차</option><option value="14">14회차</option><option value="15">15회차</option><option value="16">16회차</option><option value="17">17회차</option><option value="18">18회차</option><option value="19">19회차</option><option value="20">20회차</option></select></div><div class="field"><label>경매 비용</label><input id="auctionCost" readonly></div>
<div class="field"><label>오토마트</label><select id="automartStatus" onchange="calc()"><option value="미출품">미출품</option><option value="낙찰">낙찰</option><option value="유찰">유찰</option></select></div>
<div class="field"><label>오토마트 비용</label><input id="automartCost" readonly></div>
</div></div>
<div class="section"><h3>손익</h3><div class="result">
<div><span>경과기간</span><b id="rDays">0일</b></div><div><span>재고이자</span><b id="rInterest">0원</b></div>
<div><span>매입비</span><b id="rPurchaseFee">0원</b></div><div><span>경매출품</span><b id="rAuction">0원</b></div>
<div><span>부대비용 합</span><b id="rExpense">0원</b></div><div><span>마진세금</span><b id="rMarginTax">0원</b></div>
<div class="main" style="grid-column:1/3"><span>예상수익</span><b id="rProfit">0원</b></div></div></div>
<button id="transferBtn" class="btn transferBtn" style="display:none" onclick="transferToAuction()">경매로 옮기기</button><button id="transferRetailBtn" class="btn transferBtn" style="display:none" onclick="transferToRetail()">소매로 옮기기</button><div class="actions"><button id="deleteBtn" class="btn danger" style="display:none" onclick="removeRecord()">삭제</button><button class="btn primary" onclick="saveRecord()">저장</button></div>
</div></div>
<script>
const KEY='dealerInventory_v1';let currentType='소매',filter='전체',editing=null;
const ids=['type','status','carNo','origin','carName','buyDate','sellDate','buyPrice','sellPrice','note','inspectionMode','inspection','insurance','paintPanels','paintMode','paint','polishMode','polish','wheel','prepExtra','encarMode','encar','heyd','intro','acqTax','transport','agency','auctionCount','automartStatus'];
const moneyIds=['buyPrice','sellPrice','inspection','insurance','paint','polish','wheel','prepExtra','encar','heyd','intro','acqTax','transport','agency'];
function all(){try{return JSON.parse(localStorage.getItem(KEY)||'[]').map(r=>{if(r.type==='경매(오토마트)')r.type='경매';return r})}catch{return[]}} function put(a){localStorage.setItem(KEY,JSON.stringify(a))}
function n(id){return Number(String(document.getElementById(id).value||'').replace(/[^0-9.-]/g,''))||0}function won(v){return Math.round(v).toLocaleString()+'원'}function short(v){return v?Math.round(v/10000).toLocaleString()+'만':'0'}
function liveMoneyFormat(el){
  const raw=String(el.value||'').replace(/[^0-9]/g,'');
  el.value=raw?Number(raw).toLocaleString():'';
}
moneyIds.forEach(id=>{
  const el=document.getElementById(id);
  if(el.type!=='hidden') el.addEventListener('input',e=>liveMoneyFormat(e.target));
});
document.getElementById('sellPriceBottom').addEventListener('input',e=>liveMoneyFormat(e.target));
function setAutoLabel(modeId,amount){
 const sel=document.getElementById(modeId),opt=sel.querySelector('option[value="auto"]');
 opt.textContent=Math.round(amount).toLocaleString()+'원';
}
function toggleCostInput(kind){
 const mode=document.getElementById(kind+'Mode'),input=document.getElementById(kind);
 input.style.display=mode.value==='manual'?'block':'none';
 if(mode.value==='manual'){input.focus();}else applyAutoCosts();
 calc();
}
function applyAutoCosts(){
 if(inspectionMode.value!=='manual')inspection.value=(35000).toLocaleString();
 const panels=Number(paintPanels.value)||0,unit=origin.value==='수입'?165000:130000,paintAuto=panels*unit;
 if(paintMode.value!=='manual')paint.value=paintAuto?paintAuto.toLocaleString():'';
 if(polishMode.value!=='manual')polish.value=(143000).toLocaleString();
 setAutoLabel('inspectionMode',35000);setAutoLabel('paintMode',paintAuto);setAutoLabel('polishMode',143000);
 inspection.style.display=inspectionMode.value==='manual'?'block':'none';
 paint.style.display=paintMode.value==='manual'?'block':'none';
 polish.style.display=polishMode.value==='manual'?'block':'none';
 calc();
}
function repairData(){return [...document.querySelectorAll('.repairRow')].map(row=>({memo:row.querySelector('.repairMemo').value.trim(),amount:Number(row.querySelector('.repairAmount').value.replace(/[^0-9]/g,''))||0})).filter(x=>x.memo||x.amount)}
function syncRepairs(){const total=repairData().reduce((a,x)=>a+x.amount,0);prepExtra.value=total;calc()}
function addRepairRow(data={}){
 const row=document.createElement('div');row.className='repairRow';
 row.innerHTML='<input class="repairMemo" placeholder="수리 내용"><input class="repairAmount" inputmode="numeric" placeholder="금액"><button type="button" class="repairDel">×</button>';
 row.querySelector('.repairMemo').value=data.memo||'';const a=row.querySelector('.repairAmount');a.value=data.amount?Number(data.amount).toLocaleString():'';
 row.querySelector('.repairMemo').addEventListener('input',syncRepairs);a.addEventListener('input',()=>{liveMoneyFormat(a);syncRepairs()});
 row.querySelector('.repairDel').onclick=()=>{row.remove();if(!repairRows.children.length)addRepairRow();syncRepairs()};
 repairRows.appendChild(row);
}
function loadRepairs(items){repairRows.innerHTML='';(items&&items.length?items:[{}]).forEach(addRepairRow);syncRepairs()}
function toggleOtherCost(kind){
 const mode=document.getElementById(kind+'Mode'),input=document.getElementById(kind);
 if(kind==='encar'&&mode.value!=='manual')input.value=(241950).toLocaleString();
 input.style.display=mode.value==='manual'?'block':'none';
 if(mode.value==='manual')input.focus();calc();
}
function costRowsData(kind){return [...document.querySelectorAll('#'+kind+'Rows .costRow')].map(row=>({memo:row.querySelector('.costMemo').value.trim(),amount:Number(row.querySelector('.costAmount').value.replace(/[^0-9]/g,''))||0})).filter(x=>x.memo||x.amount)}
function syncCostRows(kind){const total=costRowsData(kind).reduce((a,x)=>a+x.amount,0);document.getElementById(kind).value=total;calc()}
function introAmountOptions(selected){
 let html='<option value="">금액 선택</option>';
 for(let v=100000;v<=1000000;v+=100000)html+='<option value="'+v+'" '+(Number(selected)===v?'selected':'')+'>'+v.toLocaleString()+'원</option>';
 html+='<option value="manual">직접입력</option>';return html;
}
function addCostRow(kind,data={}){
 const row=document.createElement('div');row.className='costRow';
 const isIntro=kind==='intro';
 row.innerHTML='<input class="costMemo" placeholder="'+(kind==='transport'?'탁송 메모':kind==='agency'?'업무대행 메모':'소개 메모')+'">'+
 (isIntro?'<div><select class="costPreset">'+introAmountOptions(data.amount)+'</select><input class="costAmount" inputmode="numeric" placeholder="금액" style="display:none;margin-top:5px"></div>':'<input class="costAmount" inputmode="numeric" placeholder="금액">')+
 '<button type="button" class="costDel">×</button>';
 row.querySelector('.costMemo').value=data.memo||'';const amt=row.querySelector('.costAmount');amt.value=data.amount?Number(data.amount).toLocaleString():'';
 if(isIntro){const sel=row.querySelector('.costPreset');if(data.amount&&Number(data.amount)%100000!==0){sel.value='manual';amt.style.display='block'}sel.onchange=()=>{if(sel.value==='manual'){amt.style.display='block';amt.focus()}else{amt.style.display='none';amt.value=sel.value?Number(sel.value).toLocaleString():''}syncCostRows(kind)}}
 row.querySelector('.costMemo').addEventListener('input',()=>syncCostRows(kind));amt.addEventListener('input',()=>{liveMoneyFormat(amt);syncCostRows(kind)});
 row.querySelector('.costDel').onclick=()=>{row.remove();if(!document.getElementById(kind+'Rows').children.length)addCostRow(kind);syncCostRows(kind)};
 document.getElementById(kind+'Rows').appendChild(row);
}
function loadCostRows(kind,items,legacyAmount){const box=document.getElementById(kind+'Rows');box.innerHTML='';const arr=items&&items.length?items:(legacyAmount?[{memo:'',amount:legacyAmount}]:[{}]);arr.forEach(x=>addCostRow(kind,x));syncCostRows(kind)}
function setType(t){currentType=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.type===t));render()}
function setFilter(f){filter=f;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.filter===f));render()}
function days(r){let a=r.buyDate?new Date(r.buyDate+'T00:00:00'):null,b=r.sellDate?new Date(r.sellDate+'T00:00:00'):new Date();if(!a)return 0;return Math.max(1,Math.floor((b-a)/86400000)+1)}
function computed(r){let d=days(r),bp=+r.buyPrice||0,rate=r.type==='소매'?.008:.013,interest=bp*rate/31*d,purchaseFee=r.type==='경매'?204000:154000;let auction=0;if((+r.auctionCount||0)>0)auction=33000+Math.max(0,(+r.auctionCount-1))*22000;let automart=r.automartStatus==='낙찰'?((+r.sellPrice||0)*.022+121000):r.automartStatus==='유찰'?100000:0;let extra=['inspection','insurance','paint','polish','wheel','prepExtra','encar','heyd','intro','acqTax','transport','agency'].reduce((s,k)=>s+(+r[k]||0),0)+auction+automart;let expense=interest+purchaseFee+extra;let taxBase=(+r.sellPrice||0)-bp-(+r.inspection||0)-(+r.paint||0)-(+r.polish||0)-(+r.wheel||0)-(+r.prepExtra||0)-(+r.encar||0)-(+r.heyd||0)-auction;let marginTax=Math.max(0,taxBase*.133);let profit=(+r.sellPrice||0)-bp-expense-marginTax;return{d,interest,purchaseFee,auction,automart,expense,marginTax,profit}}
function render(){let q=document.getElementById('search').value.trim().toLowerCase(),a=all().filter(r=>(currentType==='소매'?r.type==='소매':r.type!=='소매')&&(filter==='전체'||r.status===filter)&&(!q||(r.carNo+' '+r.carName).toLowerCase().includes(q)));let selling=a.filter(r=>r.status==='판매중'),sumBuy=selling.reduce((s,r)=>s+(+r.buyPrice||0),0),sumSell=selling.reduce((s,r)=>s+(+r.sellPrice||0),0),sumProfit=selling.reduce((s,r)=>s+computed(r).profit,0);kCount.textContent=selling.length+'대';kBuy.textContent=short(sumBuy);kSell.textContent=short(sumSell);kProfit.textContent=short(sumProfit);list.innerHTML=a.length?a.sort((x,y)=>(y.buyDate||'').localeCompare(x.buyDate||'')).map(r=>{let c=computed(r);return '<article class="car" onclick="openForm(\''+r.id+'\')"><div><div class="carTop"><span class="badge '+(r.status==='판매중'?'sale':'done')+'">'+r.status+'</span><span class="badge '+(r.type!=='소매'?'auction':'')+'">'+r.type+'</span></div><div class="carName">'+esc(r.carName||'차량명 없음')+'</div><div class="carNo">'+esc(r.carNo||'번호 없음')+'</div></div><div class="money"><b>'+short(+r.sellPrice||0)+'</b><small>'+((c.profit>=0?'+':'')+short(c.profit))+'</small></div><div class="meta"><span>매입 '+(r.buyDate||'-')+'</span><span>'+c.d+'일 · 원가 '+short((+r.buyPrice||0)+c.expense)+'</span></div></article>'}).join(''):'<div class="empty">등록된 차량이 없습니다.<br><b>＋ 등록</b>으로 첫 차량을 추가해보세요.</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openForm(id){editing=id||null;let r=id?all().find(x=>x.id===id):null;ids.forEach(k=>document.getElementById(k).value=r?.[k]??'');if(!r){type.value=currentType;status.value='판매중';origin.value='국산';buyDate.value=new Date().toISOString().slice(0,10);inspectionMode.value='auto';paintMode.value='auto';polishMode.value='auto';encarMode.value='auto';paintPanels.value='0';encar.value=(241950).toLocaleString();auctionCount.value=1;automartStatus.value='미출품'}else{inspectionMode.value=r.inspectionMode||'auto';paintMode.value=r.paintMode||'auto';polishMode.value=r.polishMode||'auto';encarMode.value=r.encarMode||'auto';automartStatus.value=r.automartStatus||'미출품'}moneyIds.forEach(k=>{let v=n(k);document.getElementById(k).value=v?v.toLocaleString():''});loadRepairs(r?.repairs||((+r?.prepExtra||0)?[{memo:'기존 상품화추가',amount:+r.prepExtra}]:[{}]));loadCostRows('intro',r?.introItems,+r?.intro||0);loadCostRows('transport',r?.transportItems,+r?.transport||0);loadCostRows('agency',r?.agencyItems,+r?.agency||0);formTitle.textContent=r?'차량 수정':'차량 등록';deleteBtn.style.display=r?'block':'none';transferBtn.style.display=r&&r.type==='소매'?'block':'none';transferRetailBtn.style.display=r&&r.type!=='소매'?'block':'none';overlay.classList.add('show');applyAutoCosts();toggleOtherCost('encar')}
function closeForm(){overlay.classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('show')){e.preventDefault();e.stopPropagation()}});
function formData(){let r={id:editing||('r'+Date.now()),updatedAt:Date.now()};ids.forEach(k=>r[k]=moneyIds.includes(k)||['paintPanels','auctionCount'].includes(k)?n(k):document.getElementById(k).value);r.repairs=repairData();r.prepExtra=r.repairs.reduce((a,x)=>a+x.amount,0);r.introItems=costRowsData('intro');r.transportItems=costRowsData('transport');r.agencyItems=costRowsData('agency');r.intro=r.introItems.reduce((a,x)=>a+x.amount,0);r.transport=r.transportItems.reduce((a,x)=>a+x.amount,0);r.agency=r.agencyItems.reduce((a,x)=>a+x.amount,0);return r}
function syncSellPrice(v){document.getElementById('sellPrice').value=String(v||'').replace(/[^0-9.-]/g,'');calc()}
function calc(){let r=formData(),c=computed(r);/* 매입원가 = 매입금액 + 재고이자 + 매입비 + 상품화/기타/경매 등 전체비용 */let cost=(+r.buyPrice||0)+c.expense;document.getElementById('purchaseCost').value=cost?Math.round(cost).toLocaleString()+'원':'';document.getElementById('auctionCost').value=c.auction?Math.round(c.auction).toLocaleString()+'원':'0원';document.getElementById('automartCost').value=c.automart?Math.round(c.automart).toLocaleString()+'원':'0원';if(document.activeElement!==document.getElementById('sellPriceBottom'))document.getElementById('sellPriceBottom').value=(+r.sellPrice||0)?(+r.sellPrice).toLocaleString():'';document.getElementById('expectedProfit').value=(c.profit>=0?'+':'')+Math.round(c.profit).toLocaleString()+'원';rDays.textContent=c.d+'일';rInterest.textContent=won(c.interest);rPurchaseFee.textContent=won(c.purchaseFee);rAuction.textContent=won(c.auction);rExpense.textContent=won(c.expense);rMarginTax.textContent=won(c.marginTax);rProfit.textContent=(c.profit>=0?'+':'')+won(c.profit)}
function saveRecord(){let r=formData();if(!r.carNo&&!r.carName){alert('차량번호 또는 차량명을 입력해주세요.');return}let a=all(),i=a.findIndex(x=>x.id===r.id);if(i>=0)a[i]=r;else a.push(r);put(a);currentType=r.type==='소매'?'소매':'경매';closeForm();setType(currentType)}
function transferToAuction(){
 if(!editing)return;let a=all(),idx=a.findIndex(x=>x.id===editing);if(idx<0)return;
 let r=formData();r.type='경매';r.status='판매중';r.sellDate='';r.sellPrice=0;r.auctionCount=r.auctionCount||1;r.updatedAt=Date.now();a[idx]=r;put(a);closeForm();currentType='경매';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.type==='경매'));render();
}
function transferToRetail(){
 if(!editing)return;let a=all(),idx=a.findIndex(x=>x.id===editing);if(idx<0)return;
 let r=formData();r.type='소매';r.status='판매중';r.sellDate='';r.sellPrice=0;r.updatedAt=Date.now();a[idx]=r;put(a);closeForm();currentType='소매';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.type==='소매'));render();
}
function removeRecord(){if(!editing||!confirm('이 차량 기록을 삭제할까요?'))return;put(all().filter(x=>x.id!==editing));closeForm();render()}
render();
</script></body></html>
