<div class="field"><label>매입금액</label><input id="buyPrice" inputmode="numeric" oninput="liveMoneyFormat(this);calc()"></div><div class="field"><label>매입원가</label><input id="purchaseCost" readonly></div>

<button id="encarCompareOnlyBtn" type="button" class="btn primary" style="width:100%;display:none" onclick="openEncarCompare()">엔카 가격비교</button>

</div></div>
<div class="section"><h3>상품화 비용</h3><div class="grid">

<div class="field"><label>도색비</label><select id="paintMode" onchange="toggleCostInput('paint')"><option value="auto">0원</option><option value="manual">직접입력</option></select><input id="paint" inputmode="numeric" oninput="liveMoneyFormat(this);calc()" style="display:none;margin-top:5px"></div>
<div class="field"><label>광택비</label><select id="polishMode" onchange="toggleCostInput('polish')"><option value="none">선택안함</option><option value="auto">143,000원</option><option value="manual">직접입력</option></select><input id="polish" inputmode="numeric" oninput="liveMoneyFormat(this);calc()" style="display:none;margin-top:5px"></div>
<div class="field"><label>휠복원</label><input id="wheel" inputmode="numeric" oninput="liveMoneyFormat(this);calc()"></div>
<div class="field"><label>매입취득세</label><input id="acqTax" inputmode="numeric" oninput="liveMoneyFormat(this);calc()"></div>
<div class="field full"><label class="labelAdd"><span>상품화추가(수리비용)</span><button type="button" class="miniAdd" onclick="addRepairRow()" aria-label="수리비용 추가">＋</button></label><div id="repairRows"></div><div class="repairTotal"><span>상품화추가 합계</span><b id="repairTotal">0원</b></div><input id="prepExtra" type="hidden"></div>
</div></div>
<div class="section"><h3>기타 비용</h3><div class="grid">
<div class="field"><label>엔카광고</label><select id="encarMode" onchange="toggleOtherCost('encar')"><option value="none">선택안함</option><option value="auto">241,950원</option><option value="manual">직접입력</option></select><input id="encar" inputmode="numeric" oninput="liveMoneyFormat(this);calc()" style="display:none;margin-top:5px"></div>
<div class="field"><label>헤딜수수료</label><input id="heyd" inputmode="numeric" oninput="liveMoneyFormat(this);calc()"></div>
<div class="field full"><label class="labelAdd"><span>소개수수료</span><button type="button" class="miniAdd" onclick="addCostRow('intro')" aria-label="소개수수료 추가">＋</button></label><div id="introRows"></div><input id="intro" type="hidden"></div>

<div class="field full"><label class="labelAdd"><span>탁송료</span><button type="button" class="miniAdd" onclick="addCostRow('transport')" aria-label="탁송료 추가">＋</button></label><div id="transportRows"></div><input id="transport" type="hidden"></div>

<div class="field"><label>경매 횟수</label><select id="auctionCount" onchange="calc()"><option value="0">선택안함</option><option value="1">1회차</option><option value="2">2회차</option><option value="3">3회차</option><option value="4">4회차</option><option value="5">5회차</option><option value="6">6회차</option><option value="7">7회차</option><option value="8">8회차</option><option value="9">9회차</option><option value="10">10회차</option><option value="11">11회차</option><option value="12">12회차</option><option value="13">13회차</option><option value="14">14회차</option><option value="15">15회차</option><option value="16">16회차</option><option value="17">17회차</option><option value="18">18회차</option><option value="19">19회차</option><option value="20">20회차</option></select></div><div class="field"><label>경매 비용</label><input id="auctionCost" readonly></div>
<div class="field"><label>오토마트</label><select id="automartStatus" onchange="calc()"><option value="미출품">미출품</option><option value="낙찰">낙찰</option><option value="유찰">유찰</option></select></div>
<div class="field"><label>오토마트 비용</label><input id="automartCost" readonly></div>
</div></div>
<div class="section"><h3>손익</h3><div class="result">
<div><span>경과기간</span><b id="rDays">0일</b></div><div><span>재고이자</span><b id="rInterest">0원</b></div>
<div><span>매입비</span><b id="rPurchaseFee">0원</b></div><div><span>경매출품</span><b id="rAuction">0원</b></div>
<div><span>부대비용 합</span><b id="rExpense">0원</b></div><div><span>마진세금</span><b id="rMarginTax">0원</b></div>
<div class="main" style="grid-column:1/3"><span>예상수익</span><b id="rProfit">0원</b></div></div></div>
<button id="transferBtn" class="btn transferBtn" style="display:none" onclick="transferToAuction()">경매로 이동</button><button id="transferRetailBtn" class="btn transferBtn" style="display:none" onclick="transferToRetail()">소매로 이동</button><div class="actions"><button id="deleteBtn" class="btn danger" style="display:none" onclick="removeRecord()">삭제</button><button class="btn primary" onclick="saveRecord()">저장</button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://crmeeegayzezeqhgkagx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_6wpAz2ELkD2Eh2ircwzVGw_78QKns9C';
const CLOUD_TABLE='inventory_records';
let supabaseClient=null,currentCloudUser=null,cloudReady=false;
const KEY='dealerInventory_v1';let currentType='소매',filter='판매중',editing=null;
const ids=['type','status','carNo','origin','carName','carYear','buyDate','sellDate','buyPrice','sellPrice','note','inspectionMode','inspection','insurance','paintPanels','paintMode','paint','polishMode','polish','wheel','prepExtra','encarMode','encar','heyd','intro','acqTax','transport','auctionCount','automartStatus','compareUrl'];
const moneyIds=['buyPrice','sellPrice','inspection','insurance','paint','polish','wheel','prepExtra','encar','heyd','intro','acqTax','transport'];
function all(){try{return JSON.parse(localStorage.getItem(KEY)||'[]').map(r=>{if(r.type==='경매(오토마트)')r.type='경매';return r})}catch{return[]}}
function put(a){localStorage.setItem(KEY,JSON.stringify(a))}
function initCloud(){if(!window.supabase)return null;if(!supabaseClient)supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return supabaseClient}
async function cloudUpsert(r){if(!cloudReady||!currentCloudUser)return;const {error}=await supabaseClient.from(CLOUD_TABLE).upsert({id:String(r.id),user_id:currentCloudUser.id,record:r,updated_at:new Date(r.updatedAt||Date.now()).toISOString()},{onConflict:'user_id,id'});if(error)console.warn('매입관리 클라우드 저장 실패',error)}
async function cloudDelete(id){if(!cloudReady||!currentCloudUser)return;const {error}=await supabaseClient.from(CLOUD_TABLE).delete().eq('user_id',currentCloudUser.id).eq('id',String(id));if(error)console.warn('매입관리 클라우드 삭제 실패',error)}
async function loadCloud(){
 const c=initCloud();if(!c)return;
 const {data:{session}}=await c.auth.getSession();currentCloudUser=session?.user||null;
 if(!currentCloudUser){console.warn('매입관리: 로그인 세션 없음');return}
 const local=all();const {data,error}=await c.from(CLOUD_TABLE).select('id,record,updated_at').eq('user_id',currentCloudUser.id);
 if(error){console.warn('매입관리 클라우드 불러오기 실패',error);return}
 cloudReady=true;
 if(!data.length&&local.length){for(const r of local)await cloudUpsert(r);render();return}
 const map=new Map(local.map(r=>[String(r.id),r]));
 for(const row of data){const rr=row.record||{};const old=map.get(String(row.id));if(!old||(+rr.updatedAt||0)>=(+old.updatedAt||0))map.set(String(row.id),rr);else await cloudUpsert(old)}
 put([...map.values()]);render();
}

function n(id){return Number(String(document.getElementById(id).value||'').replace(/[^0-9.-]/g,''))||0}function won(v){return Math.round(v).toLocaleString()+'원'}function short(v){return v?Math.round(v/10000).toLocaleString()+'만':'0'}
function liveMoneyFormat(el){
  const raw=String(el.value||'').replace(/[^0-9]/g,'');
  el.value=raw?Number(raw).toLocaleString()+'원':'';
}
function moneyDeleteKey(e){
  const el=e.target,v=String(el.value||'');
  if(e.key==='Backspace'&&v.endsWith('원')&&el.selectionStart===v.length&&el.selectionEnd===v.length){
    e.preventDefault();
    const raw=v.replace(/[^0-9]/g,'');
    const next=raw.slice(0,-1);
    el.value=next?Number(next).toLocaleString()+'원':'';
    el.dispatchEvent(new Event('input',{bubbles:true}));
  }
}
moneyIds.forEach(id=>{
  const el=document.getElementById(id);
  if(el.type!=='hidden'){el.addEventListener('input',e=>liveMoneyFormat(e.target));el.addEventListener('keydown',moneyDeleteKey);}
});
document.getElementById('sellPriceBottom').addEventListener('input',e=>liveMoneyFormat(e.target));document.getElementById('sellPriceBottom').addEventListener('keydown',moneyDeleteKey);
function setAutoLabel(modeId,amount){
 const sel=document.getElementById(modeId),opt=sel.querySelector('option[value="auto"]');
 opt.textContent=Math.round(amount).toLocaleString()+'원';
}
function toggleCostInput(kind){
 const mode=document.getElementById(kind+'Mode'),input=document.getElementById(kind);
 input.style.display=mode.value==='manual'?'block':'none';
 if(mode.value==='manual'){input.focus();}else applyAutoCosts();
 calc();
}
function applyTypeDefaults(){const a=type.value==='경매';inspectionMode.value=a?'none':'auto';polishMode.value=a?'none':'auto';encarMode.value=a?'none':'auto';applyAutoCosts();toggleOtherCost('encar')}
function applyAutoCosts(){
 const isAuction=type.value==='경매';
 if(inspectionMode.value==='none')inspection.value='';else if(inspectionMode.value==='auto')inspection.value=isAuction?'':(35000).toLocaleString()+'원';
 const panels=Number(paintPanels.value)||0,unit=origin.value==='수입'?165000:130000,paintAuto=panels*unit;
 if(paintMode.value!=='manual')paint.value=paintAuto?paintAuto.toLocaleString()+'원':'';
 if(polishMode.value==='none')polish.value='';else if(polishMode.value==='auto')polish.value=isAuction?'':(143000).toLocaleString()+'원';
 setAutoLabel('inspectionMode',isAuction?0:35000);setAutoLabel('paintMode',paintAuto);setAutoLabel('polishMode',isAuction?0:143000);
 inspection.style.display=inspectionMode.value==='manual'?'block':'none';
 paint.style.display=paintMode.value==='manual'?'block':'none';
 polish.style.display=polishMode.value==='manual'?'block':'none';
 calc();
}
function repairData(){return [...document.querySelectorAll('.repairRow')].map(row=>({memo:row.querySelector('.repairMemo').value.trim(),amount:Number(row.querySelector('.repairAmount').value.replace(/[^0-9]/g,''))||0,taxable:row.querySelector('.repairTaxCheck').checked})).filter(x=>x.memo||x.amount)}
function syncRepairs(){const total=repairData().reduce((a,x)=>a+x.amount,0);prepExtra.value=total;const el=document.getElementById('repairTotal');if(el)el.textContent=Math.round(total).toLocaleString()+'원';calc()}
function addRepairRow(data={}){
 const row=document.createElement('div');row.className='repairRow';
 row.innerHTML='<input class="repairMemo" placeholder="수리 내용"><input class="repairAmount" inputmode="numeric" placeholder="금액"><label class="repairTax" title="체크하면 세금처리 비용으로 반영"><input type="checkbox" class="repairTaxCheck">세금처리</label><button type="button" class="repairDel">×</button>';
 row.querySelector('.repairMemo').value=data.memo||'';const a=row.querySelector('.repairAmount');a.value=data.amount?Number(data.amount).toLocaleString()+'원':'';const tax=row.querySelector('.repairTaxCheck');tax.checked=data.taxable===true;
 row.querySelector('.repairMemo').addEventListener('input',syncRepairs);a.addEventListener('input',()=>{liveMoneyFormat(a);syncRepairs()});tax.addEventListener('change',syncRepairs);
 row.querySelector('.repairDel').onclick=()=>{row.remove();if(!repairRows.children.length)addRepairRow();syncRepairs()};
 repairRows.appendChild(row);
}
function loadRepairs(items){repairRows.innerHTML='';(items&&items.length?items:[{}]).forEach(addRepairRow);syncRepairs()}
function toggleOtherCost(kind){
 const mode=document.getElementById(kind+'Mode'),input=document.getElementById(kind);
 if(kind==='encar'){if(mode.value==='none')input.value='';else if(mode.value==='auto')input.value=type.value==='경매'?'':(241950).toLocaleString();}
 input.style.display=mode.value==='manual'?'block':'none';
 if(mode.value==='manual')input.focus();calc();
}
function costRowsData(kind){return [...document.querySelectorAll('#'+kind+'Rows .costRow')].map(row=>({memo:row.querySelector('.costMemo').value.trim(),amount:Number(row.querySelector('.costAmount').value.replace(/[^0-9]/g,''))||0})).filter(x=>x.memo||x.amount)}
function syncCostRows(kind){const total=costRowsData(kind).reduce((a,x)=>a+x.amount,0);document.getElementById(kind).value=total;calc()}
function introAmountOptions(selected){
 let html='<option value="">금액 선택</option>';
 for(let v=100000;v<=1000000;v+=100000)html+='<option value="'+v+'" '+(Number(selected)===v?'selected':'')+'>'+v.toLocaleString()+'원</option>';
 html+='<option value="manual">직접입력</option>';return html;
}
function addCostRow(kind,data={}){
 const row=document.createElement('div');row.className='costRow';
 const isIntro=kind==='intro';
 row.innerHTML='<input class="costMemo" placeholder="'+(kind==='transport'?'탁송 메모':'소개 메모')+'">'+
 (isIntro?'<div><select class="costPreset">'+introAmountOptions(data.amount)+'</select><input class="costAmount" inputmode="numeric" placeholder="금액" style="display:none;margin-top:5px"></div>':'<input class="costAmount" inputmode="numeric" placeholder="금액">')+
 '<button type="button" class="costDel">×</button>';
 row.querySelector('.costMemo').value=data.memo||'';const amt=row.querySelector('.costAmount');amt.value=data.amount?Number(data.amount).toLocaleString()+'원':'';
 if(isIntro){const sel=row.querySelector('.costPreset');if(data.amount&&Number(data.amount)%100000!==0){sel.value='manual';amt.style.display='block'}sel.onchange=()=>{if(sel.value==='manual'){amt.style.display='block';amt.focus()}else{amt.style.display='none';amt.value=sel.value?Number(sel.value).toLocaleString()+'원':''}syncCostRows(kind)}}
 row.querySelector('.costMemo').addEventListener('input',()=>syncCostRows(kind));amt.addEventListener('input',()=>{liveMoneyFormat(amt);syncCostRows(kind)});
 row.querySelector('.costDel').onclick=()=>{row.remove();if(!document.getElementById(kind+'Rows').children.length)addCostRow(kind);syncCostRows(kind)};
 document.getElementById(kind+'Rows').appendChild(row);
}
function loadCostRows(kind,items,legacyAmount){const box=document.getElementById(kind+'Rows');box.innerHTML='';const arr=items&&items.length?items:(legacyAmount?[{memo:'',amount:legacyAmount}]:[{}]);arr.forEach(x=>addCostRow(kind,x));syncCostRows(kind)}
function setType(t){currentType=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.type===t));render()}
function setFilter(f){filter=f;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.filter===f));render()}
function days(r){let a=r.buyDate?new Date(r.buyDate+'T00:00:00'):null,b=r.sellDate?new Date(r.sellDate+'T00:00:00'):new Date();if(!a)return 0;return Math.max(1,Math.floor((b-a)/86400000)+1)}
function computed(r){let d=days(r),bp=+r.buyPrice||0,rate=r.type==='소매'?.008:.013,interest=bp*rate/31*d,purchaseFee=r.type==='경매'?204000:154000;let auction=0;if((+r.auctionCount||0)>0)auction=33000+Math.max(0,(+r.auctionCount-1))*22000;let automart=r.automartStatus==='낙찰'?((+r.sellPrice||0)*.022+121000):r.automartStatus==='유찰'?100000:0;let extra=['inspection','paint','polish','wheel','prepExtra','encar','heyd','intro','acqTax','transport'].reduce((s,k)=>s+(+r[k]||0),0)+auction+automart;let expense=interest+purchaseFee+extra;let taxableRepairs=(r.repairs||[]).reduce((sum,x)=>sum+(x.taxable?(+x.amount||0):0),0);let taxHandled=(+r.inspection||0)+(+r.encar||0)+(+r.heyd||0)+(+r.polish||0)+taxableRepairs;let taxBase=(+r.sellPrice||0)-bp-taxHandled;let marginTax=Math.max(0,taxBase*.133);let profit=(+r.sellPrice||0)-bp-expense-marginTax;return{d,interest,purchaseFee,auction,automart,expense,taxableRepairs,taxHandled,taxBase,marginTax,profit}}
function render(){
 let q=document.getElementById('search').value.trim().toLowerCase(),records=all();
 let retailCount=records.filter(r=>r.type==='소매'&&r.status==='판매중').length;
 let auctionCount=records.filter(r=>r.type!=='소매'&&r.status==='판매중').length;
 kRetailCount.textContent=retailCount+'대';kAuctionCount.textContent=auctionCount+'대';
 let a=records.filter(r=>(currentType==='소매'?r.type==='소매':r.type!=='소매')&&r.status===filter&&(!q||(r.carNo+' '+r.carName).toLowerCase().includes(q)));
 list.innerHTML=a.length?a.sort((x,y)=>(y.buyDate||'').localeCompare(x.buyDate||'')).map(r=>{
  let c=computed(r),warning=(r.status==='판매중'&&c.d>90)?'<b class="stockWarning">⚠ 재고 90일 초과</b>':'';
  let encarBtn=r.type==='소매'?'<button type="button" class="btn primary quickEncar" onclick="event.stopPropagation();openRecordEncar(\\''+r.id+'\\')">엔카</button>':'';
  return '<article class="car" onclick="openForm(\\''+r.id+'\\')"><div><div class="carTop"><span class="badge '+(r.status==='판매중'?'sale':'done')+'">'+r.status+'</span><span class="badge '+(r.type!=='소매'?'auction':'')+'">'+r.type+'</span></div><div class="carName">'+esc(r.carName||'차량명 없음')+'</div><div class="carNo">'+esc(r.carNo||'번호 없음')+'</div></div><div class="money"><b>'+short(+r.sellPrice||0)+'</b><small id="quickProfit_'+r.id+'">'+((c.profit>=0?'+':'')+short(c.profit))+'</small></div><div class="quickTools" onclick="event.stopPropagation()"><div class="quickPrice"><span>판매금액</span><input inputmode="numeric" value="'+((+r.sellPrice||0)?(+r.sellPrice).toLocaleString()+'원':'')+'" placeholder="판매금액" onkeydown="moneyDeleteKey(event)" oninput="quickSellPrice(\\''+r.id+'\\',this)"><b class="quickProfit '+(c.profit<0?'minus':'')+'" id="quickProfitText_'+r.id+'">'+((c.profit>=0?'+':'')+won(c.profit))+'</b></div>'+encarBtn+'</div><div class="meta"><span>매입 '+(r.buyDate||'-')+warning+'</span><span>'+c.d+'일 · 원가 '+short((+r.buyPrice||0)+c.expense)+'</span></div></article>'
 }).join(''):'<div class="empty">등록된 차량이 없습니다.<br><b>＋ 등록</b>으로 첫 차량을 추가해보세요.</div>'
}
function quickSellPrice(id,el){liveMoneyFormat(el);let a=all(),i=a.findIndex(x=>x.id===id);if(i<0)return;let r=a[i];r.sellPrice=Number(String(el.value||'').replace(/[^0-9]/g,''))||0;r.updatedAt=Date.now();a[i]=r;put(a);cloudUpsert(r);let c=computed(r),p=document.getElementById('quickProfitText_'+id),p2=document.getElementById('quickProfit_'+id);if(p){p.textContent=(c.profit>=0?'+':'')+won(c.profit);p.classList.toggle('minus',c.profit<0)}if(p2)p2.textContent=(c.profit>=0?'+':'')+short(c.profit)}
function openRecordEncar(id){let r=all().find(x=>x.id===id);if(!r)return;let url=String(r.compareUrl||'').trim();if(!url){alert('이 차량의 엔카 검색결과 URL이 저장되어 있지 않습니다.');return}if(!/^https?:\\/\\//i.test(url))url='https://'+url;try{new URL(url)}catch(e){alert('올바른 엔카 URL이 아닙니다.');return}if(window.AndroidExternal&&typeof window.AndroidExternal.openUrl==='function'){window.AndroidExternal.openUrl(url);return}window.open(url,'_blank','noopener,noreferrer')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openForm(id){editing=id||null;let r=id?all().find(x=>x.id===id):null;ids.forEach(k=>document.getElementById(k).value=r?.[k]??'');if(!r){type.value=currentType;status.value='판매중';origin.value='국산';buyDate.value=new Date().toISOString().slice(0,10);inspectionMode.value=currentType==='경매'?'none':'auto';paintMode.value='auto';polishMode.value=currentType==='경매'?'none':'auto';encarMode.value=currentType==='경매'?'none':'auto';paintPanels.value='0';encar.value=currentType==='경매'?'':(241950).toLocaleString()+'원';auctionCount.value=currentType==='경매'?1:0;automartStatus.value='미출품'}else{inspectionMode.value=r.inspectionMode||'auto';paintMode.value=r.paintMode||'auto';polishMode.value=r.polishMode||'auto';encarMode.value=r.encarMode||'auto';automartStatus.value=r.automartStatus||'미출품'}moneyIds.forEach(k=>{let v=n(k);document.getElementById(k).value=v?v.toLocaleString()+'원':''});loadRepairs(r?.repairs||((+r?.prepExtra||0)?[{memo:'기존 상품화추가',amount:+r.prepExtra}]:[{}]));loadCostRows('intro',r?.introItems,+r?.intro||0);loadCostRows('transport',r?.transportItems,+r?.transport||0);formTitle.textContent=r?'차량 수정':'차량 등록';deleteBtn.style.display=r?'block':'none';transferBtn.style.display=r&&r.type==='소매'?'block':'none';transferRetailBtn.style.display=r&&r.type!=='소매'?'block':'none';overlay.classList.add('show');applyAutoCosts();toggleOtherCost('encar');updateEncarCompareUI()}
function closeForm(){overlay.classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('show')){e.preventDefault();e.stopPropagation()}});
function isAndroidApp(){return !!(window.AndroidFile||window.AndroidPurchase||window.AndroidRegistrationOCR||window.AndroidExternal)}
function updateEncarCompareUI(){
 const app=isAndroidApp(),editor=document.getElementById('encarUrlEditor'),btn=document.getElementById('encarCompareOnlyBtn');
 if(editor)editor.style.display=app?'none':'grid';
 if(btn)btn.style.display=app?'block':'none';
}
function openEncarCompare(){
 let url=String(compareUrl.value||'').trim();
 if(!url){alert(isAndroidApp()?'PC에서 이 차량의 엔카 검색결과 URL을 먼저 저장해주세요.':'엔카 검색결과 URL을 붙여넣어주세요.');return}
 if(!/^https?:\/\//i.test(url))url='https://'+url;
 try{new URL(url)}catch(e){alert('올바른 엔카 URL을 입력해주세요.');return}
 compareUrl.value=url;
 if(window.AndroidExternal&&typeof window.AndroidExternal.openUrl==='function'){window.AndroidExternal.openUrl(url);return}
 window.open(url,'_blank','noopener,noreferrer');
}
function formData(){let r={id:editing||('r'+Date.now()),updatedAt:Date.now()};ids.forEach(k=>r[k]=moneyIds.includes(k)||['paintPanels','auctionCount'].includes(k)?n(k):document.getElementById(k).value);r.repairs=repairData();r.prepExtra=r.repairs.reduce((a,x)=>a+x.amount,0);r.introItems=costRowsData('intro');r.transportItems=costRowsData('transport');r.intro=r.introItems.reduce((a,x)=>a+x.amount,0);r.transport=r.transportItems.reduce((a,x)=>a+x.amount,0);return r}
function syncSellPrice(v){document.getElementById('sellPrice').value=String(v||'').replace(/[^0-9.-]/g,'');calc()}
function calc(){let r=formData(),c=computed(r);/* 매입원가 = 매입금액 + 재고이자 + 매입비 + 상품화/기타/경매 등 전체비용 */let cost=(+r.buyPrice||0)+c.expense;document.getElementById('purchaseCost').value=cost?Math.round(cost).toLocaleString()+'원':'';document.getElementById('auctionCost').value=c.auction?Math.round(c.auction).toLocaleString()+'원':'0원';document.getElementById('automartCost').value=c.automart?Math.round(c.automart).toLocaleString()+'원':'0원';if(document.activeElement!==document.getElementById('sellPriceBottom'))document.getElementById('sellPriceBottom').value=(+r.sellPrice||0)?(+r.sellPrice).toLocaleString()+'원':'';document.getElementById('expectedProfit').value=(c.profit>=0?'+':'')+Math.round(c.profit).toLocaleString()+'원';document.getElementById('expectedProfit').classList.toggle('profitPlus',c.profit>=0);document.getElementById('expectedProfit').classList.toggle('profitMinus',c.profit<0);rDays.textContent=c.d+'일';rInterest.textContent=won(c.interest);rPurchaseFee.textContent=won(c.purchaseFee);rAuction.textContent=won(c.auction);rExpense.textContent=won(c.expense);rMarginTax.textContent=won(c.marginTax);rProfit.textContent=(c.profit>=0?'+':'')+won(c.profit)}
function saveRecord(){let r=formData();if(!r.carNo&&!r.carName){alert('차량번호 또는 차량명을 입력해주세요.');return}let a=all(),i=a.findIndex(x=>x.id===r.id);if(i>=0)a[i]=r;else a.push(r);put(a);cloudUpsert(r);currentType=r.type==='소매'?'소매':'경매';closeForm();setType(currentType)}
function transferToAuction(){
 if(!editing)return;let a=all(),idx=a.findIndex(x=>x.id===editing);if(idx<0)return;
 let r=formData();r.type='경매';r.status='판매중';r.sellDate='';r.sellPrice=0;r.auctionCount=(+r.auctionCount||1);r.updatedAt=Date.now();a[idx]=r;put(a);cloudUpsert(r);closeForm();currentType='경매';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.type==='경매'));render();
}
function transferToRetail(){
 if(!editing)return;let a=all(),idx=a.findIndex(x=>x.id===editing);if(idx<0)return;
 let r=formData();r.type='소매';r.status='판매중';r.sellDate='';r.sellPrice=0;r.updatedAt=Date.now();a[idx]=r;put(a);cloudUpsert(r);closeForm();currentType='소매';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.type==='소매'));render();
}
function removeRecord(){if(!editing||!confirm('이 차량 기록을 삭제할까요?'))return;const id=editing;put(all().filter(x=>x.id!==id));cloudDelete(id);closeForm();render()}
render();loadCloud();
</script></body></html>
