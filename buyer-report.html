:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:#1b2b42;background:#f3f5fa;line-height:1.65}*{box-sizing:border-box}body{margin:0}main{max-width:940px;margin:28px auto;background:#fff;border:1px solid #dce4ef;border-radius:20px;overflow:hidden}.brand{display:flex;align-items:center;gap:10px;font-size:13px;color:#a9bddb;letter-spacing:1px}.brand img{width:38px;height:38px;border-radius:8px}.head{padding:32px;background:#101b30;color:#fff}.head h1{font-size:28px;margin:16px 0 7px}.head p{margin:0;color:#cad6e9}.content{padding:10px 28px 26px}.section{margin:22px 0;padding:24px;border:1px solid #e0e7f2;border-radius:13px;background:#fff}.section h2{color:#295fe8;font-size:19px;margin:0 0 17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fields b{display:block;font-size:12px;color:#6c7a8f}.row{border-top:1px solid #e9edf4;padding:12px 0;overflow-wrap:anywhere}.row p{margin:5px 0 0 77px;color:#65748b;white-space:pre-wrap;font-size:14px}.badge{display:inline-block;min-width:65px;text-align:center;padding:3px 7px;border-radius:6px;font-size:12px;margin-right:11px;background:#eef2f8;color:#536884}.badge.normal{background:#e8f6ef;color:#247449}.badge.issue{background:#fff0ed;color:#b83a2c}.badge.unavailable{background:#fff4de;color:#936914}.summary{font-size:13px;color:#65748b}.photos{display:grid;grid-template-columns:1fr 1fr;gap:20px}.photos figure{margin:0}.photos img{width:100%;max-height:360px;object-fit:contain;background:#f2f5fa;border-radius:9px;cursor:zoom-in}.photos figcaption{font-size:13px;margin-top:7px}.note{white-space:pre-wrap;overflow-wrap:anywhere}.foot{padding:0 26px 26px;color:#6a788d;font-size:12px}.message{text-align:center;padding:55px 22px;color:#63728a}.message strong{display:block;color:#243754;font-size:21px;margin-bottom:10px}.meta{font-size:12px;color:#a8bddb;margin-top:15px}.actions{display:flex;justify-content:flex-end;padding:17px 28px 0}button{font:inherit;border:1px solid #dce4ef;border-radius:8px;padding:7px 15px;background:white;color:#3d587d;cursor:pointer}dialog{width:min(1100px,calc(100% - 24px));max-height:95dvh;padding:14px;border:0;border-radius:14px;background:#fff}dialog::backdrop{background:#101b30d0}dialog img{display:block;max-width:100%;max-height:80dvh;object-fit:contain;margin:auto}dialog button{float:right;margin-bottom:8px}.photo-error{color:#a43c37;font-size:12px}a{color:#295fe8}
@media(max-width:640px){main{margin:0;border:0;border-radius:0}.head{padding:25px 22px}.head h1{font-size:24px}.content{padding:1px 14px 20px}.section{padding:19px;margin:17px 0}.fields{gap:13px}.photos{gap:12px}.row p{margin-left:0}.actions{padding-right:18px}.foot{padding:0 23px 27px}}

</style></head><body><main><header class="head"><div class="brand"><img src="assets/dealer-mate-logo.webp" alt="">DEALER MATE · BUYER REPORT</div><h1>알선검차 리포트</h1><p id="vehicleTitle">차량 상태와 확인 사진</p><div id="reportMeta" class="meta"></div></header><div id="reportStatus" class="message" role="status">리포트를 불러오는 중입니다.</div><div id="reportActions" class="actions" hidden><button type="button" onclick="window.print()">인쇄 / PDF</button></div><div id="reportContent" class="content" hidden></div><footer class="foot">검차 시점에 확인한 내용을 기록한 리포트입니다. 미확인·확인불가 항목은 추가 확인이 필요합니다.</footer></main><dialog id="photoViewer"><button type="button" onclick="document.getElementById('photoViewer').close()">닫기</button><img id="expandedPhoto" alt="확인 사진"></dialog><script>
const REPORT_API='https://crmeeegayzezeqhgkagx.supabase.co';
const REPORT_KEY='sb_publishable_6wpAz2ELkD2Eh2ircwzVGw_78QKns9C';
const REPORT_STATES={pending:'미확인',normal:'정상',issue:'이상',unavailable:'확인불가'};
let reportExpiry=0,reportRequest=0;
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text??'');if(cls)e.className=cls;return e}
function rows(value){return Array.isArray(value)?value.slice(0,200):[]}
function section(title){const s=node('section',undefined,'section');s.append(node('h2',title));document.getElementById('reportContent').append(s);return s}
function stateRows(target,list){rows(list).forEach(r=>{const row=node('div',undefined,'row'),state=Object.hasOwn(REPORT_STATES,r?.state)?r.state:'pending';row.append(node('span',REPORT_STATES[state],'badge '+state),node('strong',r?.title||'확인 항목'));if(r?.memo)row.append(node('p',r.memo));target.append(row)})}
function safePhotoUrl(raw){try{const u=new URL(raw);if(u.origin===REPORT_API&&u.pathname.startsWith('/storage/v1/object/sign/inspection-photos/'))return u.href}catch{}return ''}
function unavailable(title,message){
 document.getElementById('reportContent').replaceChildren();document.getElementById('reportContent').hidden=true;document.getElementById('reportActions').hidden=true;document.getElementById('reportMeta').textContent='';document.getElementById('vehicleTitle').textContent='차량 상태와 확인 사진';
 const box=document.getElementById('reportStatus');box.replaceChildren(node('strong',title),node('div',message));box.hidden=false;const dialog=document.getElementById('photoViewer');if(dialog.open)dialog.close();document.getElementById('expandedPhoto').removeAttribute('src');
}
function renderBuyerReport(data){
 const report=data?.report;if(!report||typeof report!=='object')throw Error('리포트가 없습니다.');
 const expiry=new Date(data.expiresAt).getTime();if(!Number.isFinite(expiry)||expiry<=Date.now())throw Error('기간이 종료되었습니다.');reportExpiry=expiry;
 const fields=rows(report.fields);document.getElementById('vehicleTitle').textContent=fields.filter(f=>['차량명','차량번호'].includes(f?.label)).map(f=>f.value).join(' · ')||'차량 상태 확인서';
 document.getElementById('reportMeta').textContent='공유일 '+new Date(data.publishedAt).toLocaleString('ko-KR')+' · 열람 기한 '+new Date(expiry).toLocaleString('ko-KR');
 const content=document.getElementById('reportContent');content.replaceChildren();
 const basic=section('01 차량 기본정보'),grid=node('div',undefined,'fields');fields.forEach(f=>{const item=node('div');item.append(node('b',f?.label||'정보'),node('span',f?.value||'미입력'));grid.append(item)});basic.append(grid);
 stateRows(section('02 외관 상태'),report.exterior);
 const accident=section('03 교환·판금 확인');if(rows(report.accidents).length)rows(report.accidents).forEach(r=>accident.append(node('div',(r?.title||'부위')+' · '+(r?.value||'기록 있음'),'row')));else accident.append(node('p','교환·판금으로 기록한 부위가 없습니다. 미선택 부위의 무사고를 확정하는 의미는 아닙니다.'));
 const detail=section('04 세부상태'),counts={pending:0,normal:0,issue:0,unavailable:0};rows(report.detail).forEach(r=>counts[Object.hasOwn(REPORT_STATES,r?.state)?r.state:'pending']++);detail.append(node('p',Object.entries(REPORT_STATES).map(([key,label])=>label+' '+counts[key]).join(' · '),'summary'));stateRows(detail,report.detail);
 section('05 종합 의견').append(node('div',report.note||'별도 의견 없음','note'));
 const photoSection=section('06 확인 사진'),photos=node('div',undefined,'photos');rows(report.photos).slice(0,60).forEach((p,i)=>{const fig=node('figure'),url=safePhotoUrl(p?.url),img=node('img');img.alt=p?.label||'확인 사진';img.loading='lazy';img.referrerPolicy='no-referrer';if(url){img.src=url;img.onerror=()=>{img.hidden=true;fig.prepend(node('p','사진을 불러오지 못했습니다. 담당자에게 다시 확인해주세요.','photo-error'))};img.onclick=()=>{document.getElementById('expandedPhoto').src=url;document.getElementById('expandedPhoto').alt=img.alt;document.getElementById('photoViewer').showModal()};fig.append(img)}else fig.append(node('p','사진을 표시할 수 없습니다.','photo-error'));fig.append(node('figcaption',(i+1)+'. '+(p?.label||'확인 사진')));photos.append(fig)});if(photos.children.length)photoSection.append(photos);else photoSection.append(node('p','첨부된 사진이 없습니다.'));
 document.getElementById('reportStatus').hidden=true;content.hidden=false;document.getElementById('reportActions').hidden=false;
}
async function loadBuyerReport(){
 const request=++reportRequest;const token=location.hash.slice(1);if(!/^[0-9a-f]{64}$/.test(token)){unavailable('리포트 링크를 확인해주세요.','담당자가 전달한 전체 링크로 다시 접속해주세요.');return}
 try{const response=await fetch(REPORT_API+'/rest/v1/rpc/read_broker_report',{method:'POST',headers:{apikey:REPORT_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:token}),cache:'no-store',credentials:'omit'});if(!response.ok)throw Error('request');const data=await response.json();if(request!==reportRequest)return;if(!data){unavailable('열람이 종료된 리포트입니다.','공유가 해제되었거나 기간이 만료되었습니다. 담당자에게 새 링크를 요청해주세요.');return}renderBuyerReport(data)}catch{if(request!==reportRequest)return;unavailable('리포트를 불러오지 못했습니다.','네트워크 연결을 확인하고 새로고침해주세요. 계속되면 담당자에게 문의해주세요.')}
}
window.addEventListener('pageshow',loadBuyerReport);window.addEventListener('hashchange',loadBuyerReport);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadBuyerReport()});
setInterval(()=>{if(reportExpiry&&Date.now()>=reportExpiry)unavailable('리포트 열람 기간이 종료되었습니다.','담당자에게 새 링크를 요청해주세요.')},30000);
loadBuyerReport();
</script></body></html>
