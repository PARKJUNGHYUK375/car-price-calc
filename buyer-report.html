  section('05 종합 의견').append(node('div',report.note||'별도 의견 없음','note premium-summary-copy'));
 const photoSection=section('06 확인 사진'),photos=node('div',undefined,'photos buyer-report-photos');rows(report.photos).slice(0,60).forEach((p,i)=>{const fig=node('figure'),url=safePhotoUrl(p?.url),img=node('img');img.alt=p?.label||'확인 사진';img.loading='lazy';img.referrerPolicy='no-referrer';if(url){img.src=url;img.onerror=()=>{img.hidden=true;fig.prepend(node('p','사진을 불러오지 못했습니다. 담당자에게 다시 확인해주세요.','photo-error'))};img.onclick=()=>openBuyerPhoto(url,img.alt);img.setAttribute('role','button');img.tabIndex=0;img.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openBuyerPhoto(url,img.alt)}};fig.append(img)}else fig.append(node('p','사진을 표시할 수 없습니다.','photo-error'));fig.append(node('figcaption',(i+1)+'. '+(p?.label||'확인 사진')));photos.append(fig)});if(photos.children.length)photoSection.append(photos);else photoSection.append(node('p','첨부된 사진이 없습니다.'));
 document.getElementById('reportStatus').hidden=true;content.hidden=false;document.getElementById('reportActions').hidden=false;

async function loadBuyerReport(){
 const request=++reportRequest;const token=location.hash.slice(1);if(!/^[0-9a-f]{64}$/.test(token)){unavailable('리포트 링크를 확인해주세요.','담당자가 전달한 전체 링크로 다시 접속해주세요.');return}
 try{const response=await fetch(REPORT_API+'/rest/v1/rpc/read_broker_report',{method:'POST',headers:{apikey:REPORT_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:token}),cache:'no-store',credentials:'omit'});if(!response.ok)throw Error('request');const data=await response.json();if(request!==reportRequest)return;if(!data){unavailable('열람이 종료된 리포트입니다.','공유가 해제되었거나 기간이 만료되었습니다. 담당자에게 새 링크를 요청해주세요.');return}renderBuyerReport(data)}catch{if(request!==reportRequest)return;unavailable('리포트를 불러오지 못했습니다.','네트워크 연결을 확인하고 새로고침해주세요. 계속되면 담당자에게 문의해주세요.')}
}
window.addEventListener('pageshow',loadBuyerReport);window.addEventListener('hashchange',loadBuyerReport);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadBuyerReport()});
setInterval(()=>{if(reportExpiry&&Date.now()>=reportExpiry)unavailable('리포트 열람 기간이 종료되었습니다.','담당자에게 새 링크를 요청해주세요.')},30000);
loadBuyerReport();
</script></body></html>
