const vehicleExteriorSelections=new Map();
function vehicleExteriorPinStatus(item){
 if(item.state==='pending'||!item.state)return {label:'미확인',kind:'pending'};
 if(item.state==='unavailable')return {label:'확인불가',kind:'pending'};
 if(item.stateLabel==='양호'||item.stateLabel==='정상')return {label:'양호',kind:'normal'};
 if(item.key?.startsWith('tire_')&&item.state==='normal')return {label:'수치',kind:'measured'};
 return {label:item.state==='normal'?'양호':'이상',kind:item.state==='normal'?'normal':'issue'};
}
function mountVehicleExteriorMap(container,items,photos,options){
 if(!container)return;container.replaceChildren();
 const list=Array.isArray(items)?items:[],allPhotos=Array.isArray(photos)?photos:[];
 const toolbar=document.createElement('div');toolbar.className='report-exterior-toolbar';
 const hint=document.createElement('span');hint.textContent='좌·중앙·우 도면을 넘기고 부위를 눌러 확인하세요.';
 const zoom=document.createElement('button');zoom.type='button';zoom.textContent='도면 확대';zoom.setAttribute('aria-pressed','false');toolbar.append(hint);
 const viewport=document.createElement('div');viewport.className='report-exterior-map-viewport';viewport.tabIndex=0;viewport.setAttribute('aria-label','외관 상태 전개도');
 const plane=document.createElement('div');plane.className='report-exterior-map-plane';
 const image=document.createElement('img');image.src='https://i.imgur.com/1OGXwOu.png';image.alt='차량 외관 전체 전개도';plane.append(image);viewport.append(plane);
 const panel=document.createElement('div');panel.className='report-exterior-selected';panel.setAttribute('aria-live','polite');
 const popup=document.createElement('dialog');popup.className='report-exterior-popup';popup.setAttribute('aria-label','외관 부위 상세');
 const close=document.createElement('button');close.type='button';close.className='report-exterior-popup-close';close.textContent='닫기';close.onclick=()=>popup.close();popup.append(close,panel);
 popup.addEventListener('click',event=>{if(event.target!==popup)return;const rect=popup.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)popup.close()});
 const tabs=document.createElement('div');tabs.className='report-exterior-tabs';tabs.setAttribute('role','group');tabs.setAttribute('aria-label','외관 도면 영역');
 let region=1;const regions=['왼쪽 측면','중앙','오른쪽 측면'],tabButtons=[];
 function showRegion(index){region=Math.max(0,Math.min(2,index));plane.style.transform='translateX(-'+(region*100/3)+'%)';tabButtons.forEach((button,i)=>button.setAttribute('aria-pressed',String(i===region)));viewport.scrollTop=0}
 regions.forEach((label,index)=>{const button=document.createElement('button');button.type='button';button.textContent=label;button.onclick=()=>showRegion(index);tabButtons.push(button);tabs.append(button)});
 let touch=null;viewport.addEventListener('touchstart',event=>{if(event.touches.length===1)touch={x:event.touches[0].clientX,y:event.touches[0].clientY}},{passive:true});
 viewport.addEventListener('touchend',event=>{if(!touch)return;const point=event.changedTouches[0],dx=point.clientX-touch.x,dy=point.clientY-touch.y;touch=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.5)showRegion(region+(dx<0?1:-1))},{passive:true});
 const buttons=new Map();
 list.forEach(item=>{
  const fallback=VEHICLE_EXTERIOR_POSITIONS[item.key],top=parseFloat(item.top??fallback?.top),left=parseFloat(item.left??fallback?.left);
  if(!Number.isFinite(top)||!Number.isFinite(left)||top<0||top>100||left<0||left>100)return;
  const status=vehicleExteriorPinStatus(item),button=document.createElement('button');button.type='button';button.className='report-exterior-pin '+status.kind;button.style.top=top+'%';button.style.left=left+'%';button.textContent=status.label;button.title=item.title+' · '+(item.stateLabel||status.label);button.setAttribute('aria-label',button.title+' · 사진 및 메모 보기');button.setAttribute('aria-pressed','false');button.onclick=()=>select(item.key,true);buttons.set(item.key,button);plane.append(button);
 });
 function select(key,scroll=false){
  const item=list.find(row=>row.key===key);if(!item)return;
  vehicleExteriorSelections.set(options.key,key);buttons.forEach((button,id)=>button.setAttribute('aria-pressed',String(id===key)));panel.replaceChildren();
  const heading=document.createElement('div');heading.className='report-exterior-selected-heading';const title=document.createElement('strong');title.textContent=item.title;
  const badge=document.createElement('span'),status=vehicleExteriorPinStatus(item);badge.className='report-exterior-selected-badge '+status.kind;badge.textContent=item.stateLabel||status.label;heading.append(title,badge);panel.append(heading);
  const matching=allPhotos.map((photo,index)=>({photo,index})).filter(({photo})=>photo.partKey===item.key||(!photo.partKey&&photo.label===item.title));
  const gallery=document.createElement('div');gallery.className='report-exterior-selected-photos';
  matching.forEach(({photo,index})=>{const src=options.photoUrl(photo);if(!src)return;const button=document.createElement('button');button.type='button';button.setAttribute('aria-label',item.title+' 사진 크게 보기');const img=document.createElement('img');img.src=src;img.alt=item.title+' 확인 사진';img.loading='lazy';button.append(img);button.onclick=()=>options.openPhoto(photo,index,src);gallery.append(button)});
  if(gallery.childElementCount)panel.append(gallery);else{const empty=document.createElement('p');empty.className='report-exterior-no-photo';empty.textContent='등록된 사진이 없습니다.';panel.append(empty)}
  const memo=document.createElement('div');memo.className='report-exterior-selected-memo';const label=document.createElement('b');label.textContent='확인 메모';const text=document.createElement('p');text.textContent=item.memo||'별도 메모 없음';memo.append(label,text);panel.append(memo);if(scroll&&!popup.open)popup.showModal();
 }
 zoom.onclick=()=>{const expanded=viewport.classList.toggle('expanded');zoom.textContent=expanded?'전체 보기':'도면 확대';zoom.setAttribute('aria-pressed',String(expanded))};
 const legend=document.createElement('div');legend.className='report-exterior-map-legend';legend.textContent='초록 양호 · 빨강 이상 · 회색 미확인/수치';
 container.append(toolbar,tabs,viewport,legend,popup);showRegion(1);
 const selected=vehicleExteriorSelections.get(options.key);if(selected&&list.some(item=>item.key===selected))select(selected);else panel.textContent='전개도에서 확인할 부위를 선택해주세요.';
}

</script></body></html>
