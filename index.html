<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>딜러솔루션</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#172033;--muted:#7b8494;--line:#e5e9ef;--red:#ef5b5b;--blue:#4777ad}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
.wrap{min-height:100vh;min-height:100dvh;max-width:720px;margin:auto;padding:calc(34px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--red);margin-bottom:8px}h1{font-size:31px;margin:0;letter-spacing:-1px}.sub{font-size:13px;color:var(--muted);margin:10px 0 27px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{border:1px solid var(--line);background:var(--card);border-radius:22px;min-height:200px;padding:21px 19px;text-decoration:none;color:inherit;display:flex;flex-direction:column;box-shadow:0 10px 28px rgba(22,34,51,.07);-webkit-tap-highlight-color:transparent}.card:active{transform:scale(.985)}
.icon{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:25px;margin-bottom:22px}.calc .icon{background:#fff0f0;color:var(--red)}.purchase .icon{background:#eef5fc;color:var(--blue)}
.title{font-size:19px;font-weight:900}.desc{font-size:12px;line-height:1.55;color:var(--muted);margin-top:7px}.open{margin-top:auto;padding-top:18px;font-size:12px;font-weight:900;color:#596477}.foot{text-align:center;color:#a0a8b4;font-size:10px;margin-top:23px}
@media(max-width:520px){.menu{grid-template-columns:1fr}.card{min-height:155px}.icon{margin-bottom:14px}}
</style>
</head>
<body>
<main class="wrap">
<div class="eyebrow">DEALER SOLUTION</div>
<h1>딜러솔루션</h1>
<p class="sub">차량 매입 업무에 필요한 기능을 선택하세요.</p>
<section class="menu">
<a class="card calc" href="depreciation.html">
<div class="icon">🚗</div><div class="title">감가계산기</div>
<div class="desc">검차 · 도색 · 사고이력 · 감가 계산 · 사진 및 검차기록 관리</div>
<div class="open">감가계산기 열기 →</div></a>
<a class="card purchase" href="purchase.html">
<div class="icon">📋</div><div class="title">매입품의서</div>
<div class="desc">차량 매입 품의서를 작성하고 관리합니다.</div>
<div class="open">매입품의서 열기 →</div></a>
</section>
<div class="foot">Dealer Solution</div>
</main>
</body></html>
