<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https://i.imgur.com; base-uri 'none'; form-action 'none'"><title>감가리포트 · 딜러메이트</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#203b5d;font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:20px auto;background:#fff;border:1px solid #dce4ef;border-radius:16px;overflow:hidden}header{background:#14263f;color:white;padding:24px}header small{color:#a8bedb}h1{font-size:25px;margin:8px 0}header p{font-size:12px;margin:4px 0;color:#c0d0e5}nav{padding:12px;display:flex;gap:6px;overflow:auto;border-bottom:1px solid #dce4ef}button{font:inherit;cursor:pointer;border:1px solid #dce4ef;border-radius:8px;padding:9px 12px;background:#f6f8fc;color:#365779;white-space:nowrap}button[aria-current="step"]{background:#295fe8;color:white;border-color:#295fe8}section{margin:16px;padding:20px;border:1px solid #dce4ef;border-radius:12px}section h2{font-size:19px;margin:0 0 15px}section p{border-top:1px solid #edf1f7;padding-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}.strong{font-weight:800}.diagram{position:relative;line-height:0;width:100%;max-width:480px;margin:20px auto;aspect-ratio:1055 / 791;background:white}.diagram.accident{aspect-ratio:1055 / 1718}.diagram img{display:block;width:100%;height:100%;object-fit:fill}.mark,.value{position:absolute;transform:translate(-50%,-50%);white-space:nowrap}.mark{display:grid;place-items:center;width:23px;height:23px;border:1.5px solid;border-radius:50%;color:#1558c0;background:#ffffffa0;font-size:12px;font-weight:900;line-height:1}.mark.red{color:#d32128}.value{font-size:11px;line-height:1.3;font-weight:900;padding:1px 3px;border-radius:3px;background:#ffffffe0;color:#1556a5}.value.high{color:#d71920}.value.with-mark{transform:translate(-50%,13px)}.pager{display:flex;align-items:center;justify-content:center;gap:18px;padding:12px}.foot{padding:18px;color:#7b8da4;font-size:11px}.error{padding:35px;text-align:center}button:disabled{opacity:.4} [hidden]{display:none!important}
@media(max-width:600px){main{margin:0;border:0;border-radius:0}section{margin:12px;padding:14px}}@media print{nav,.pager,.print{display:none}section[hidden]{display:block!important}section{break-before:page}.diagram{break-inside:avoid}main{max-width:none;border:0;margin:0}header{print-color-adjust:exact}}
</style></head><body><main><header><small>DEALER MATE · DEDUCTION REPORT</small><h1>감가리포트</h1><p id="meta"></p></header><p id="status" class="error" role="status">리포트를 불러오는 중입니다.</p><nav id="tabs" aria-label="감가리포트 페이지" hidden></nav><div id="content"></div><div class="pager" id="pager" hidden><button id="previous">이전</button><span id="pageCount" aria-live="polite"></span><button id="next">다음</button></div><div class="foot">생성 시점의 검차내용입니다. 링크에 리포트 내용이 포함되어 있으며 원본 기록과 별도로 열람됩니다. 미표시 부위는 무사고를 확정하는 의미가 아닙니다. <button class="print" onclick="window.print()">인쇄 / PDF</button></div></main><script>
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=String(text);if(cls)node.className=cls;return node}
function drawDiagram(data){
 const accident=data.kind==='accident',box=el('div',undefined,'diagram'+(accident?' accident':'')),image=el('img');image.src=accident?'https://i.imgur.com/agbd7Z8.png':'https://i.imgur.com/1OGXwOu.png';image.alt=accident?'교환·판금 및 도막측정 도면':'도색 선택 부위 도면';box.append(image);
 for(const p of (Array.isArray(data.points)?data.points:[]).slice(0,100)){
  const top=Number(p.top),left=Number(p.left);if(!Number.isFinite(top)||!Number.isFinite(left)||top<0||top>100||left<0||left>100)continue;
  const mark=['R','X','W','XX','WW'].includes(p.mark)?p.mark:'';
  const position=node=>{node.style.top=top+'%';node.style.left=left+'%';node.title=String(p.title||'부위');box.append(node)};
  if(mark)position(el('span',mark,'mark'+(mark.includes('X')||!accident?' red':'')));
  if(typeof p.value==='number'&&Number.isFinite(p.value)&&p.value>=0&&p.value<=100000)position(el('span',p.value+' μm','value'+(p.value>=400?' high':'')+(mark?' with-mark':'')));
 }
 return box;
}
async function decodeReport(){
 const token=new URLSearchParams(location.hash.slice(1)).get('r')||'';if(token.length>30000||!/^([jd])\.[A-Za-z0-9_-]+$/.test(token))throw Error('올바른 리포트 링크가 아닙니다.');
 const format=token[0],bytes=Uint8Array.from(atob(token.slice(2).replaceAll('-','+').replaceAll('_','/')),c=>c.charCodeAt(0));
 let stream=new Blob([bytes]).stream();if(format==='d'){if(typeof DecompressionStream!=='function')throw Error('이 브라우저에서 리포트를 열 수 없습니다. 최신 Chrome으로 열어주세요.');stream=stream.pipeThrough(new DecompressionStream('deflate'))}
 const reader=stream.getReader(),chunks=[];let length=0;
 try{while(true){const {value,done}=await reader.read();if(done)break;length+=value.length;if(length>200000){await reader.cancel();throw Error('리포트 크기가 너무 큽니다.')}chunks.push(value)}}finally{reader.releaseLock()}
 const raw=new Uint8Array(length);let offset=0;for(const chunk of chunks){raw.set(chunk,offset);offset+=chunk.length}
 const report=JSON.parse(new TextDecoder().decode(raw));if(report.version!==1||!Array.isArray(report.sections)||report.sections.length>20)throw Error('지원하지 않는 리포트입니다.');
 return report;
}
function showReport(report){
 const meta=document.getElementById('meta'),content=document.getElementById('content'),tabs=document.getElementById('tabs'),sections=[],buttons=[];
 const date=new Date(report.created);meta.textContent=String(report.carNumber||'차량')+' · '+(Number.isFinite(date.getTime())?date.toLocaleString('ko-KR'):'')+' · 입찰가 '+String(report.bidPrice||'0')+'원';
 let count=0;
 report.sections.forEach((item,index)=>{
  const section=el('section'),title=String(item.title||'검차 내역').slice(0,100);section.append(el('h2',title));
  for(const row of (Array.isArray(item.rows)?item.rows:[]).slice(0,1000)){
   if(++count>3000)throw Error('리포트 항목이 너무 많습니다.');
   if(row.diagram){section.append(drawDiagram(row.diagram));continue}
   if(typeof row.text==='string')section.append(el('p',row.text.slice(0,20000),row.strong?'strong':''));
  }
  sections.push(section);content.append(section);const button=el('button',title);button.onclick=()=>select(index);tabs.append(button);buttons.push(button);
 });
 if(!sections.length)throw Error('리포트 내용이 없습니다.');
 let page=0;function select(index){page=Math.max(0,Math.min(sections.length-1,index));sections.forEach((section,i)=>section.hidden=i!==page);buttons.forEach((button,i)=>button.setAttribute('aria-current',i===page?'step':'false'));document.getElementById('previous').disabled=page===0;document.getElementById('next').disabled=page===sections.length-1;document.getElementById('pageCount').textContent=(page+1)+' / '+sections.length}
 document.getElementById('previous').onclick=()=>select(page-1);document.getElementById('next').onclick=()=>select(page+1);
 document.getElementById('status').hidden=true;tabs.hidden=false;document.getElementById('pager').hidden=false;select(0);
}
decodeReport().then(showReport).catch(error=>{document.getElementById('content').replaceChildren();document.getElementById('status').textContent=error.message||'리포트를 불러오지 못했습니다.'});
</script></body></html>
